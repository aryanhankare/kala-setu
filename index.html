@keyframes bounce-in{0%{transform:scale(0)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.animate-fade-in{animation:fade-in .35s ease-out both}
.animate-scale-in{animation:scale-in .4s cubic-bezier(.22,1,.36,1) both}
.animate-bounce-in{animation:bounce-in .5s cubic-bezier(.22,1,.36,1) both}
.delay-100{animation-delay:.1s}
.delay-200{animation-delay:.2s}
.delay-300{animation-delay:.3s}
.delay-400{animation-delay:.4s}
.delay-500{animation-delay:.5s}

.wave-dot:nth-child(2){animation-delay:.15s}
.wave-dot:nth-child(3){animation-delay:.3s}
.shadow-card{box-shadow:0 2px 8px rgba(0,0,0,0.25)}
.shadow-elevated{box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.gradient-bg{background:linear-gradient(180deg,#0b0f14 0%,#151e29 100%)}

.btn-primary:active{transform:scale(.98)}
.btn-secondary{background:#151e29;color:#94a3b8;padding:12px 24px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid #1e293b;cursor:pointer;transition:all .2s}
.btn-secondary:hover{background:#1b2634;color:#e2e8f0}
.btn-ghost{background:transparent;color:#94a3b8;padding:10px 16px;border-radius:8px;font-weight:500;font-size:14px;border:none;cursor:pointer}
.btn-ghost:hover{background:#151e29}
input,textarea,select{font-family:inherit;color:#f1f5f9}

const Badge=({children,variant="default",className=""})=>{
  const styles={
    default:"bg-[#151e29] text-[#e2e8f0]",

    forest:"bg-[#0e2f38] text-[#22d3ee]",

  };
  return <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ${styles[variant]} ${className}`}>{children}</span>;
};

// Async chat function that calls the Gemini API
const chatWithAI=async(msg,context)=>{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg,context:context||{}}),
      signal:controller.signal
    });
    clearTimeout(timeout);
    if(!resp.ok){
      const errData=await resp.json().catch(()=>({}));
      throw new Error(errData.error||'AI service unavailable');
    }
    const data=await resp.json();
    return data.reply;
  }catch(e){
    clearTimeout(timeout);
    if(e.name==='AbortError')throw new Error('AI took too long to respond. Please try again.');
    throw e;
  }
};

// ==================== MAIN APP ====================
const App=()=>{
  const [role,setRole]=useState(null);
  const [page,setPage]=useState('home');
  const [lang,setLang]=useState('en');
  const [cart,setCart]=useState([]);
  const [orders,setOrders]=useState([]);
  const [myProducts,setMyProducts]=useState(()=>{try{const s=localStorage.getItem('kalasetu_products');return s?JSON.parse(s):[];}catch(e){return [];}});
  const [selectedProduct,setSelectedProduct]=useState(null);
  const [selectedArtisan,setSelectedArtisan]=useState(null);
  const [catFlow,setCatFlow]=useState({step:0,photoDesc:'',voiceDesc:'',result:null,enhanced:false,finalPrice:0});
  const [notification,setNotification]=useState(null);
  const [artisanProfile,setArtisanProfile]=useState({name:'',craft:'',village:'',district:'',state:'',photo:'',story:'',language:'Hindi'});
  const [onboarded,setOnboarded]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');
  const [selectedCategory,setSelectedCategory]=useState(null);
  const [selectedRegion,setSelectedRegion]=useState(null);
  const [showLangMenu,setShowLangMenu]=useState(false);
  const [wishlist,setWishlist]=useState([]);
  const toggleWishlist=(id)=>setWishlist(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);

  const addToCart=(product)=>{
    setCart(prev=>{
      const exists=prev.find(c=>c.id===product.id);
      if(exists)return prev.map(c=>c.id===product.id?{...c,qty:c.qty+1}:c);
      return [...prev,{...product,qty:1}];
    });
    showNotif("Added to cart! 🛒");
  };

  const removeFromCart=(id)=>setCart(prev=>prev.filter(c=>c.id!==id));

  const placeOrder=()=>{
    const orderNum="KS"+Date.now().toString(36).toUpperCase();
    window.__lastOrderNum=orderNum;
    const newOrder={
      id:orderNum,
      items:[...cart],
      total:cart.reduce((s,c)=>s+c.price*c.qty,0),
      date:new Date().toLocaleDateString('en-IN'),
      status:'New',
      address:"Demo Address, India",
      phone:"9876543210"
    };
    setOrders(prev=>[newOrder,...prev]);
    setCart([]);
    setPage('orderConfirmed');
    return orderNum;
  };

  const showNotif=(msg)=>{
    setNotification(msg);
    setTimeout(()=>setNotification(null),2500);
  };

  const val={
    role,setRole,page,setPage,lang,setLang,cart,setCart,orders,setOrders,
    myProducts,setMyProducts,selectedProduct,setSelectedProduct,
    selectedArtisan,setSelectedArtisan,catFlow,setCatFlow,
    artisanProfile,setArtisanProfile,onboarded,setOnboarded,
    addToCart,removeFromCart,placeOrder,showNotif,
    searchQuery,setSearchQuery,selectedCategory,setSelectedCategory,
    selectedRegion,setSelectedRegion,showLangMenu,setShowLangMenu,
    wishlist,toggleWishlist,
  };

  return (
    <AppContext.Provider value={val}>
      <div className="min-h-screen bg-[#0b0f14]">
        {notification&&(
          <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-[#818cf8] text-[#f1f5f9] px-5 py-3 rounded-lg text-sm font-medium shadow-float animate-slide-up" style={{maxWidth:380}}>
            {notification}
          </div>
        )}
        {!role?<LandingPage/>:
          role==='artisan'?
            (onboarded?<ArtisanApp/>:<OnboardingFlow/>):
            <BuyerApp/>
        }
      </div>
    </AppContext.Provider>
  );
};

const OnboardingFlow=()=>{

  const [step,setStep]=useState(0);

  const crafts=["Handloom Weaving","Terracotta & Pottery","Embroidery","Bamboo Weaving","Brass & Metalwork","Wood Carving","Block Printing","Jewellery Making","Painting","Leather Work"];

  const update=(k,v)=>setArtisanProfile(p=>({...p,[k]:v}));
  const handleOnboardingVoice=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setTimeout(()=>{setArtisanProfile(p=>({...p,story:p.story?(p.story+' I learned this craft from my family and have been practicing for many years.'):'I learned this craft from my family and have been practicing for many years.'}));},1500);return;}try{const r=new SR();r.continuous=false;r.interimResults=false;r.lang='hi-IN';r.onresult=(e)=>{const t=e.results[0][0].transcript;setArtisanProfile(p=>({...p,story:p.story?(p.story+' '+t):t}));};r.start();}catch(e){setTimeout(()=>{setArtisanProfile(p=>({...p,story:p.story?(p.story+' I learned this craft from my family.'):'I learned this craft from my family.'}));},1500);}};

  return (
    <div className="min-h-screen gradient-bg flex flex-col">
      <div className="px-5 pt-12 pb-4">
        <div className="flex items-center gap-2 mb-2">
          {[0,1,2,3].map(i=>(

// ==================== ADD PRODUCT FLOW ====================
const AddProductFlow=()=>{
  const {catFlow,setCatFlow,setPage,showNotif,artisanProfile,setMyProducts}=useContext(AppContext);
  const [voiceText,setVoiceText]=useState("");
  const [isRecording,setIsRecording]=useState(false);
  const [photoUploaded,setPhotoUploaded]=useState(false);
  const [photoData,setPhotoData]=useState(null);
  const [language,setLanguage]=useState('en');
  const [editedPrice,setEditedPrice]=useState('');
  const [editedTitle,setEditedTitle]=useState('');
  const [editedDesc,setEditedDesc]=useState('');
  const [editedMaterials,setEditedMaterials]=useState([]);
  const [editedTags,setEditedTags]=useState([]);
  const [showEnhance,setShowEnhance]=useState(false);
  const [enhanced,setEnhanced]=useState(false);
  const [publishStep,setPublishStep]=useState(0);
  const [isAnalyzing,setIsAnalyzing]=useState(false);
  const [analyzeError,setAnalyzeError]=useState(null);
  const fileInputRef=React.useRef(null);

  // --- REAL IMAGE UPLOAD ---
  const handlePhotoSelect=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const allowed=['image/jpeg','image/jpg','image/png','image/webp'];
    if(!allowed.includes(file.type)){
      showNotif('Please select a JPG, PNG or WEBP image');
      return;
    }
    if(file.size>10*1024*1024){
      showNotif('Image must be under 10MB');
      return;
    }
    const reader=new FileReader();
    reader.onload=()=>{
      setPhotoData(reader.result);
      setPhotoUploaded(true);
      setAnalyzeError(null);
    };
    reader.readAsDataURL(file);
  };

  // --- REAL AI ANALYSIS ---
const runAnalysis=async(photoData,voiceDesc)=>{
  setIsAnalyzing(true);
  setAnalyzeError(null);
  setCatFlow(p=>({...p,step:1}));

  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),15000);

    const resp=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        image:photoData,
        description:voiceDesc||''
      }),
      signal:controller.signal
    });

    clearTimeout(timeout);

    if(!resp.ok){
      const errData=await resp.json().catch(()=>({}));
      throw new Error(errData.error||'AI service unavailable');
    }

    const result=await resp.json();

    const minPrice=Number(result.minPrice)||800;
    const maxPrice=Number(result.maxPrice)||1500;
    const suggestedPrice=Math.round((minPrice+maxPrice)/2);

    const finalResult={
      ...result,
      minPrice,
      maxPrice,
      suggestedPrice
    };

    setCatFlow(p=>({
      ...p,
      step:2,
      result:finalResult,
      finalPrice:suggestedPrice
    }));

    setEditedTitle(finalResult.title);
    setEditedDesc(finalResult.description);
    setEditedPrice(String(suggestedPrice));
    setEditedMaterials(Array.isArray(finalResult.materials)?finalResult.materials:[]);
    setEditedTags(Array.isArray(finalResult.tags)?finalResult.tags:[]);

    setIsAnalyzing(false);

  }catch(err){
    console.warn('AI analysis failed:',err.message);

    setIsAnalyzing(false);
    setCatFlow(p=>({...p,step:0}));
    setAnalyzeError(
      'AI service unavailable — please try again or enter the product details manually.'
    );
  }
};

  const exampleTranscripts=[
    "This is a handwoven cotton saree. I made it by hand using traditional weaving techniques. It took me about 8 days to complete.",
    "A beautiful terracotta sculpture of a Rajasthani camel. I shaped this by hand from local clay and fired it in a traditional kiln.",
    "Hand-embroidered silk dupatta with traditional Moti-kaam threadwork. Each piece takes about 5 days to complete.",
    "A handwoven bamboo basket, traditionally used in Assamese households. Sustainable and durable.",
  ];
  const recognitionRef=React.useRef(null);

  const handleVoiceDemo=()=>{
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SpeechRecognition&&!isRecording){
      try{
        const recognition=new SpeechRecognition();
        recognition.continuous=false;
        recognition.interimResults=false;
        recognition.lang=language==='hi'?'hi-IN':language==='mr'?'mr-IN':'en-IN';
        recognition.onresult=(event)=>{
          const transcript=event.results[0][0].transcript;
          setVoiceText(prev=>prev?(prev+' '+transcript):transcript);
          setIsRecording(false);
        };
        recognition.onerror=()=>{
          setIsRecording(false);
          // Fallback to demo transcript on error
          const transcript=exampleTranscripts[Math.floor(Math.random()*exampleTranscripts.length)];
          setVoiceText(transcript);
          showNotif('Voice demo used — speech recognition not available');
        };
        recognition.onend=()=>{setIsRecording(false);};
        recognitionRef.current=recognition;
        recognition.start();
        setIsRecording(true);
      }catch(e){
        // Fallback to demo
        setIsRecording(true);
        setTimeout(()=>{
          const transcript=exampleTranscripts[Math.floor(Math.random()*exampleTranscripts.length)];
          setVoiceText(transcript);
          setIsRecording(false);
        },2000);
      }
    }else if(isRecording&&recognitionRef.current){
      recognitionRef.current.stop();
      setIsRecording(false);
    }else{
      // Fallback demo when no speech recognition available
      setIsRecording(true);
      setTimeout(()=>{
        const transcript=exampleTranscripts[Math.floor(Math.random()*exampleTranscripts.length)];
        setVoiceText(transcript);
        setIsRecording(false);
      },2000);
    }
  };



  const handlePublish=()=>{
    setPublishStep(1);
    const catStr=(catFlow.result&&catFlow.result.category)||'Other';
    const newProduct={
      id:Date.now(),
      artisanId:0,
      name:editedTitle,
      category:catStr||'Other',
      subcategory:(catFlow.result&&catFlow.result.subcategory)||'General',
      price:parseInt(editedPrice)||0,
      minPrice:(catFlow.result&&catFlow.result.minPrice)||0,
      maxPrice:(catFlow.result&&catFlow.result.maxPrice)||0,
      description:editedDesc,
      materials:[...editedMaterials],
      tags:[...editedTags],
      images:photoData?[photoData]:[],
      region:artisanProfile.state||artisanProfile.village||'India',
      available:true,
      artisanName:artisanProfile.name||'Artisan',
      artisanLocation:(artisanProfile.village||'')+', '+(artisanProfile.state||''),
      createdAt:new Date().toISOString(),
      published:true
    };
    setMyProducts(prev=>[newProduct,...prev]);
    try{
      const existing=JSON.parse(localStorage.getItem('kalasetu_products')||'[]');
      existing.unshift(newProduct);
      localStorage.setItem('kalasetu_products',JSON.stringify(existing));
    }catch(e){console.warn('localStorage save failed',e);}
    setTimeout(()=>{
      setPublishStep(2);
    },1500);
  };

  if(catFlow.step===0){
    return (
      <div className="px-5 pt-12 animate-slide-up">
        <button onClick={()=>{setCatFlow({step:0,photoDesc:'',voiceDesc:'',result:null,enhanced:false,finalPrice:0});setPage('home');}} className="flex items-center gap-2 text-[#64748b] mb-6">
          <Icon name="arrowLeft" size={20}/> Back
        </button>
        <h1 className="font-display text-[24px] font-bold text-[#f1f5f9] mb-2 tracking-tight">Add your craft</h1>
        <p className="text-[#64748b] mb-8">Take a photo and tell us about your product. We'll help create the listing.</p>

        <div className="space-y-4 mb-8">
          <input ref={fileInputRef} type="file" accept="image/jpeg,image/jpg,image/png,image/webp" onChange={handlePhotoSelect} className="hidden"/>
          <button onClick={()=>fileInputRef.current?.click()} className={`w-full border-2 border-dashed rounded-xl ${photoUploaded?'py-4':'py-8'} flex flex-col items-center gap-3 transition-all ${photoUploaded?'border-tertiary bg-[#0e2f38]':'border-[#1e293b] bg-[#151e29] hover:border-[#c7d2fe]'}`}>            {photoUploaded&&photoData?(
              <>
                <img src={photoData} alt="Uploaded product" className="w-full h-40 object-cover rounded-xl"/>
                <div className="flex items-center gap-2">
                  <Icon name="check" size={16} className="text-[#22d3ee]"/>
                  <p className="font-semibold text-[#22d3ee] text-sm">Photo uploaded — tap to change</p>
                </div>
              </>
            ):photoUploaded?(
              <>
                <div className="w-14 h-14 rounded-xl flex items-center justify-center bg-[#0e2f38] text-[#22d3ee]">
                  <Icon name="check" size={28}/>
                </div>
                <p className="font-semibold text-[#22d3ee]">Photo uploaded ✓</p>
              </>
            ):(
              <>
                <div className="w-14 h-14 rounded-xl flex items-center justify-center bg-[#151e29] text-[#64748b]">
                  <Icon name="camera" size={28}/>
                </div>
                <div>
                  <p className="font-semibold text-[#e2e8f0]">Upload / Take Photos</p>
                  <p className="text-xs text-[#64748b] mt-1">Tap to select from gallery or camera</p>
                </div>
              </>
            )}
          </button>

          <div className="bg-[#151e29] rounded-xl p-5 shadow-card">
            <label className="text-sm font-medium text-[#e2e8f0] mb-3 block flex items-center gap-2">
              <Icon name="mic" size={16} className="text-[#818cf8]"/> {isRecording?'Speak now... 🎙️':'Tell us about your craft'}
            </label>
            <p className="text-xs text-[#64748b] mb-3">{isRecording?'Listening in '+language.toUpperCase()+' — tap mic to stop':'Speak or type in any language (Hindi, Marathi, English)'}</p>
            <textarea value={voiceText} onChange={e=>setVoiceText(e.target.value)} rows={4} placeholder='Example: "This is a handwoven cotton saree..."'
              className="w-full text-sm text-[#e2e8f0] placeholder:text-[#475569] resize-none focus:outline-none mb-3"/>
            <div className="flex gap-2">
              <button onClick={handleVoiceDemo} className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl font-medium text-sm transition-all ${isRecording?'bg-[#2d1b1b] text-red-600 border-2 border-[#7f1d1d]':'bg-[#eef2ff] text-[#818cf8] border border-[#e0e7ff]'}`}>
                <Icon name="mic" size={18}/> {isRecording?'Stop Recording 🎙️':'Tap to Speak'}
              </button>
            </div>
            {isRecording&&<div className="flex justify-center gap-2 mt-3"><span className="wave-dot"/><span className="wave-dot"/><span className="wave-dot"/></div>}
          </div>
        </div>

        {analyzeError&&(
          <div className="bg-[#0e2f38] border border-[#164e63] rounded-xl p-4 mb-4 flex items-start gap-3 animate-slide-up">
            <span className="text-xl">⚠️</span>
            <div>
              <p className="text-sm font-medium text-[#22d3ee]">{analyzeError}</p>
              <p className="text-xs text-[#22d3ee] mt-1">You can still edit all fields manually. For best results, try again when the AI service is available.</p>
            </div>
          </div>
        )}
        <button onClick={()=>runAnalysis(photoData,voiceText)} disabled={!photoUploaded||isAnalyzing}
          className={`w-full py-[18px] rounded-xl font-semibold text-[15px] transition-all flex items-center justify-center gap-2.5 ${photoUploaded?'bg-[#6366f1] text-[#f1f5f9] shadow-elevated active:scale-[.98]':'bg-[#151e29] text-[#64748b] cursor-not-allowed'}`}>
          <Icon name="sparkles" size={20}/> {isAnalyzing?'Analyzing...':'AI Analyze Product'}
        </button>
      </div>
    );
  }

  if(catFlow.step===1){
    const steps=[
      {t:"Analyzing your product photo...",delay:0},
      {t:"Identifying product type & craft...",delay:2000},
      {t:"Understanding materials & technique...",delay:4000},
      {t:"Creating your listing...",delay:6000},
      {t:"Suggesting a fair price...",delay:8000},

    return (

    const r=catFlow.result;
    return (
      <div className="px-5 pt-12 pb-8">

        <div className="mb-6 animate-bounce-in">
          <div className="text-6xl">🎉</div>
        </div>
        <h1 className="text-2xl font-bold text-[#f1f5f9] mb-2 animate-slide-up">Your craft is now live!</h1>

            View Product
          </button>

            if(navigator.share){
              navigator.share({
                title:editedTitle,
                text:`Check out this handmade craft on KalaSetu!\n\n${editedTitle}\nby ${artisanProfile.name||'Artisan'}\nPrice: ₹${parseInt(editedPrice).toLocaleString('en-IN')}\n\nShop authentic handmade crafts at KalaSetu`,
                url:window.location.href
              }).catch(()=>{});
            }else{
              const text=`Check out this handmade craft on KalaSetu!\n${editedTitle} by ${artisanProfile.name||'Artisan'} — ₹${parseInt(editedPrice).toLocaleString('en-IN')}`;

            Back to Dashboard
          </button>
        </div>
      </div>
    );

  return null;
};

// ==================== ARTISAN PRODUCTS ====================
const ArtisanProducts=()=>{
  const [editingProduct,setEditingProduct]=useState(null);
  const [editName,setEditName]=useState('');
  const [editPrice,setEditPrice]=useState('');
  const [editDesc,setEditDesc]=useState('');
  const {showNotif,myProducts,setMyProducts}=useContext(AppContext);

  const allProducts=[...PRODUCTS,...myProducts];

  const startEdit=(p)=>{setEditingProduct(p);setEditName(p.name);setEditPrice(String(p.price));setEditDesc(p.description);};
  const saveEdit=()=>{
    if(!editingProduct)return;
    const updated=myProducts.map(p=>p.id===editingProduct.id?{...p,name:editName,price:parseInt(editPrice)||p.price,description:editDesc}:p);
    setMyProducts(updated);
    try{localStorage.setItem('kalasetu_products',JSON.stringify(updated));}catch(e){}
    setEditingProduct(null);
    showNotif('Product updated! ✅');
  };
  const deleteProduct=(id)=>{
    const updated=myProducts.filter(p=>p.id!==id);
    setMyProducts(updated);
    try{localStorage.setItem('kalasetu_products',JSON.stringify(updated));}catch(e){}
    showNotif('Product deleted 🗑️');
  };

  if(editingProduct){
    return (
      <div className="px-5 pt-12 pb-8">
        <button onClick={()=>setEditingProduct(null)} className="flex items-center gap-2 text-[#64748b] mb-6">
          <Icon name="arrowLeft" size={20}/> Back
        </button>
        <h1 className="text-2xl font-bold text-[#f1f5f9] mb-6">Edit Product</h1>
        <div className="bg-[#151e29] rounded-xl overflow-hidden shadow-card mb-5">
          <img src={(editingProduct.images&&editingProduct.images[0])||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" fill="%23f5f0eb"><rect width="400" height="160"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="16" fill="%23bbb">No Image</text></svg>')} className="w-full h-40 object-cover" alt=""/>
        </div>
        <div className="space-y-4">
          <div className="bg-[#151e29] rounded-xl p-4 shadow-card">
            <label className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-2 block">Product Name</label>
            <input value={editName} onChange={e=>setEditName(e.target.value)} className="w-full font-semibold text-[#e2e8f0] text-lg focus:outline-none bg-transparent border-b border-[#1e293b] pb-1"/>
          </div>
          <div className="bg-[#151e29] rounded-xl p-4 shadow-card">
            <label className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-2 block">Price (₹)</label>
            <input type="number" value={editPrice} onChange={e=>setEditPrice(e.target.value)} className="w-32 text-xl font-bold text-[#818cf8] focus:outline-none bg-transparent border-b border-[#1e293b] pb-1"/>
          </div>
          <div className="bg-[#151e29] rounded-xl p-4 shadow-card">
            <label className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-2 block">Description</label>
            <textarea value={editDesc} onChange={e=>setEditDesc(e.target.value)} rows={4} className="w-full text-sm text-[#e2e8f0] resize-none focus:outline-none bg-transparent"/>
          </div>
          <div className="bg-[#151e29] rounded-xl p-4 shadow-card">
            <label className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-2 block">Category</label>
            <p className="font-medium text-[#e2e8f0]">{editingProduct.category} → {editingProduct.subcategory}</p>
          </div>
          <div className="bg-[#151e29] rounded-xl p-4 shadow-card">
            <label className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-2 block">Materials</label>
            <div className="flex flex-wrap gap-2">{editingProduct.materials.map(m=><Badge key={m} variant="terra">{m}</Badge>)}</div>
          </div>
        </div>
        <div className="flex gap-3 mt-6">
          <button onClick={()=>setEditingProduct(null)} className="flex-1 py-3.5 rounded-xl font-medium text-[#64748b] border border-[#1e293b] bg-[#151e29] hover:bg-[#1b2634] transition-colors">Cancel</button>
          <button onClick={saveEdit} className="flex-1 py-3.5 rounded-xl font-semibold text-[#f1f5f9] bg-[#6366f1] shadow-elevated">Save Changes</button>
        </div>
      </div>
    );
  }

  return (
    <div className="px-5 lg:px-8 pt-12 lg:pt-20">
      <h1 className="text-2xl font-bold text-[#f1f5f9] mb-1">My Products</h1>
      <p className="text-[#64748b] text-sm mb-6">{allProducts.length} products listed</p>
      <div className="space-y-3">
        {allProducts.map((p,i)=>(
          <div key={p.id} className="bg-[#151e29] rounded-xl p-3 flex gap-3 shadow-card animate-slide-up" style={{animationDelay:`${i*30}ms`}}>
            <img src={p.images&&p.images[0]} className="w-20 h-20 rounded-xl object-cover" alt={p.name}/>
            <div className="flex-1 min-w-0">
              <p className="font-medium text-sm text-[#e2e8f0] truncate">{p.name}</p>
              <p className="text-xs text-[#64748b]">{p.category} • {p.region||'India'}</p>
              <div className="flex items-center justify-between mt-2">
                <p className="text-sm font-bold text-[#818cf8]">₹{(p.price||0).toLocaleString('en-IN')}</p>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#0e2f38] text-[#22d3ee] font-medium">{p.published?'New':'Live'}</span>
                  <button onClick={(e)=>{e.stopPropagation();startEdit(p);}} className="text-[#64748b] hover:text-[#818cf8]"><Icon name="edit" size={14}/></button>
                  {p.published&&<button onClick={(e)=>{e.stopPropagation();deleteProduct(p.id);}} className="text-[#475569] hover:text-[#ef4444]"><Icon name="trash" size={14}/></button>}
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

// ==================== AI ASSISTANT ====================
const AIAssistant=()=>{
  const {artisanProfile,catFlow,myProducts}=useContext(AppContext);
  const [messages,setMessages]=useState([
    {from:'ai',text:"Namaste! 🙏 I'm KalaSetu AI, your digital business assistant. How can I help you today?"},
  ]);
  const [input,setInput]=useState('');
  const [isLoading,setIsLoading]=useState(false);
  const messagesEnd=useRef(null);

  useEffect(()=>{messagesEnd.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const quickActions=["Why am I not getting orders?","Suggest a price","Translate product","What should I make next?"];

  // Build context for the AI
  const buildContext=()=>{
    const ctx={};
    if(artisanProfile.name)ctx.artisanName=artisanProfile.name;
    if(artisanProfile.craft)ctx.artisanCraft=artisanProfile.craft;
    if(artisanProfile.village||artisanProfile.state)ctx.artisanLocation=[artisanProfile.village,artisanProfile.state].filter(Boolean).join(', ');
    if(catFlow.result){
      ctx.productName=catFlow.result.title||catFlow.result.identified;
      ctx.productCategory=catFlow.result.category;
      ctx.productPrice=catFlow.result.price||catFlow.result.minPrice+'-'+catFlow.result.maxPrice;
      ctx.productDescription=catFlow.result.description;
      ctx.productMaterials=(catFlow.result.materials||[]).join(', ');
      ctx.productTags=(catFlow.result.tags||[]).join(', ');
    }
    if(myProducts&&myProducts.length>0){
      const latest=myProducts[0];
      if(!ctx.productName){
        ctx.productName=latest.name;
        ctx.productCategory=latest.category;
        ctx.productPrice=latest.price;
        ctx.productDescription=latest.description;
        ctx.productMaterials=(latest.materials||[]).join(', ');
        ctx.productTags=(latest.tags||[]).join(', ');
      }
    }
    return ctx;
  };

  const send=async(msg)=>{
    const text=msg||input;
    if(!text.trim()||isLoading)return;
    setMessages(p=>[...p,{from:'user',text}]);
    setInput('');
    setIsLoading(true);
    try{
      const reply=await chatWithAI(text,buildContext());
      setMessages(p=>[...p,{from:'ai',text:reply}]);
    }catch(e){
      setMessages(p=>[...p,{from:'ai',text:"I'm having trouble connecting right now. Please try again."}]);
      console.error('Chat error:',e.message||e);
    }finally{
      setIsLoading(false);
    }
  };

  return (
    <div className="flex flex-col h-screen bg-[#0b0f14]">
      <div className="bg-[#151e29]/95 backdrop-blur-xl border-b border-[#1e293b]/80 px-5 pt-12 pb-4 flex items-center gap-3">
        <div className="w-10 h-10 bg-gradient-to-br from-[#22d3ee] to-[#22d3ee] rounded-xl flex items-center justify-center text-[#f1f5f9]">
          <Icon name="bot" size={20}/>
        </div>
        <div>
          <h2 className="font-bold text-[#e2e8f0] font-display">KalaSetu AI</h2>
          <p className="text-[11px] text-[#22d3ee] font-medium">Your digital business assistant</p>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-5 py-4 space-y-4 hide-scrollbar">
        {messages.map((m,i)=>(
          <div key={i} className={`flex ${m.from==='user'?'justify-end':'justify-start'}`}>
            <div className={`max-w-[80%] rounded-xl px-4 py-3 text-sm ${m.from==='user'?'bg-[#6366f1] text-[#f1f5f9] rounded-br-md':'bg-[#151e29] text-[#e2e8f0] shadow-card rounded-bl-md'}`}>
              {m.text}
            </div>
          </div>
        ))}
        {isLoading&&(
          <div className="flex justify-start">
            <div className="bg-[#151e29] text-[#64748b] shadow-card rounded-xl rounded-bl-md px-4 py-3 text-sm flex items-center gap-2">
              <span className="animate-pulse">Thinking</span><span className="flex gap-0.5"><span className="w-1 h-1 bg-[#64748b] rounded-full animate-bounce" style={{animationDelay:'0ms'}}/><span className="w-1 h-1 bg-[#64748b] rounded-full animate-bounce" style={{animationDelay:'150ms'}}/><span className="w-1 h-1 bg-[#64748b] rounded-full animate-bounce" style={{animationDelay:'300ms'}}/></span>
            </div>
          </div>
        )}
        <div ref={messagesEnd}/>
      </div>

      {messages.length<=1&&!isLoading&&(
        <div className="px-5 pb-2 flex flex-wrap gap-2">
          {quickActions.map((qa,i)=>(
            <button key={i} onClick={()=>send(qa)} disabled={isLoading} className="text-xs bg-[#151e29] border border-[#1e293b] text-[#64748b] px-3 py-2 rounded-xl hover:bg-[#0b0f14] transition-all disabled:opacity-50">
              {qa}
            </button>
          ))}
        </div>
      )}

      <div className="px-5 py-3 bg-[#151e29]/95 backdrop-blur-xl border-t border-[#1e293b]/80 flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!isLoading&&send()}
          disabled={isLoading}
          placeholder={isLoading?'KalaSetu AI is thinking...':'Ask anything about your craft business...'}
          className="flex-1 bg-[#0b0f14] rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6366f1]/20 disabled:opacity-50"/>
        <button onClick={()=>send()} disabled={isLoading||!input.trim()} className="w-11 h-11 bg-[#6366f1] rounded-xl flex items-center justify-center text-[#f1f5f9] disabled:opacity-50 disabled:cursor-not-allowed">
          <Icon name="send" size={18}/>
        </button>
      </div>
    </div>
  );
};

const ProductCard=({product:p,compact,onClick})=>{
  const artisan=ARTISANS.find(a=>a.id===p.artisanId);
  const{wishlist,toggleWishlist}=useContext(AppContext);
  const isWished=wishlist.includes(p.id);
  const imgSrc=(p.images&&p.images[0])||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" fill="%23f3f0eb"><rect width="400" height="300"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="18" fill="%23c4bfb8">Craft</text></svg>');
  return (
    <div onClick={onClick} className={`${compact?'min-w-[170px] w-[170px] lg:min-w-0 lg:w-auto':'w-full'} bg-[#151e29] rounded-xl overflow-hidden shadow-card border border-[#1e293b]/40 cursor-pointer group hover:shadow-card transition-all duration-300`}>
      <div className="relative overflow-hidden">
        <img src={imgSrc} className={`${compact?'h-44':'h-56'} w-full object-cover group-hover:scale-105 transition-transform duration-500`} alt={p.name} loading="lazy"/>
        <div className="absolute top-2 left-2"><span className="bg-[#151e29]/90 backdrop-blur-sm text-[#e2e8f0] text-[10px] font-semibold px-2 py-1 rounded-md">{p.category}</span></div>
        <button onClick={(e)=>{e.stopPropagation();toggleWishlist(p.id);}} className="absolute top-2 right-2 w-7 h-7 bg-[#151e29]/90 backdrop-blur-sm rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <Icon name="heart" size={14} className={isWished?'text-[#ef4444]':'text-[#64748b]'}/>
        </button>
        {isWished&&<div className="absolute top-2 right-2 w-7 h-7 bg-[#151e29]/90 backdrop-blur-sm rounded-full flex items-center justify-center lg:hidden">
          <Icon name="heart" size={14} className="text-[#ef4444]"/>
        </div>}
      </div>
      <div className="p-3">
        <p className={`font-medium text-[#f1f5f9] ${compact?'text-[13px] truncate':'text-sm line-clamp-2'}`}>{p.name}</p>
        {(!compact&&<p className="text-[11px] text-[#64748b] mt-1">by {artisan?.name||p.artisanName||'Artisan'}</p>)}
        <div className="flex items-center justify-between mt-2">
          <p className="font-semibold text-[#818cf8] text-sm">₹{p.price.toLocaleString('en-IN')}</p>
          {p.region&&!compact&&<span className="text-[10px] text-[#64748b]">{p.region}</span>}
        </div>
      </div>
    </div>
  );
};

const BuyerExplore=()=>{
  const {setPage,setSelectedProduct,setSelectedArtisan,searchQuery,setSearchQuery,myProducts}=useContext(AppContext);
  const [selectedCat,setSelectedCat]=useState(null);
  const [selectedReg,setSelectedReg]=useState(null);
  const [priceRange,setPriceRange]=useState(null);
  const allProducts=[...PRODUCTS,...(myProducts||[])];

  let filtered=allProducts;
  if(searchQuery){const q=searchQuery.toLowerCase();filtered=filtered.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)||(p.materials||[]).join(' ').toLowerCase().includes(q)||(p.tags||[]).join(' ').toLowerCase().includes(q)||(p.artisanName||'').toLowerCase().includes(q));}
  if(selectedCat)filtered=filtered.filter(p=>p.category===selectedCat);
  if(selectedReg)filtered=filtered.filter(p=>p.region===selectedReg);
  if(priceRange)filtered=filtered.filter(p=>p.price>=priceRange[0]&&p.price<=priceRange[1]);

  return (
    <div className="pt-12 lg:pt-20">
      <div className="lg:hidden px-5 mb-4">
        <h1 className="font-display text-[24px] font-bold text-[#f1f5f9] mb-4">Explore</h1>
        <div className="bg-[#151e29] rounded-xl px-4 py-3 flex items-center gap-3 shadow-card border border-[#1e293b]/50">

          <button onClick={()=>setShowInquiry(true)} className="flex-1 py-3.5 rounded-xl font-semibold text-[#e2e8f0] border border-[#1e293b] bg-[#151e29] flex items-center justify-center gap-2 shadow-card">
            <Icon name="message" size={18}/> Enquire
          </button>
          <button onClick={()=>{addToCart(p);showNotif("Added to cart! 🛒");}} className="flex-1 py-3.5 rounded-xl font-semibold text-[#f1f5f9] bg-[#6366f1] hover:bg-[#4338ca] flex items-center justify-center gap-2 shadow-elevated active:scale-[.97] transition-all">
            <Icon name="cart" size={18}/> Add to Cart
          </button>
        </div>
      </div>

      {/* Inquiry Modal */}
      {showInquiry&&(
        <div className="fixed inset-0 z-50 bg-black/40 flex items-end justify-center">
          <div className="bg-[#151e29] rounded-t-3xl w-full max-w-[430px] p-6 animate-slide-up" style={{maxHeight:'80vh'}}>
            <div className="w-12 h-1 bg-[#151e29] rounded-full mx-auto mb-4"/>
            {inquirySent?(
              <div className="text-center py-6">
                <div className="text-4xl mb-3">✅</div>
                <h3 className="font-bold text-lg text-[#e2e8f0] mb-1">Inquiry Sent!</h3>
                <p className="text-sm text-[#64748b] mb-4">{artisan?.name||'The artisan'} will respond to your enquiry soon.</p>
                <button onClick={()=>{setShowInquiry(false);setInquirySent(false);setInquiryMsg('');setInquiryQty('1');}} className="w-full py-3 rounded-xl font-semibold bg-[#6366f1] text-[#f1f5f9]">Done</button>
              </div>
            ):<> 
              <h3 className="font-bold text-[#e2e8f0] text-lg mb-1">Enquire about this craft</h3>
              <p className="text-sm text-[#64748b] mb-4">Message {artisan?.name||'the artisan'} about {p.name}</p>
              <div className="bg-[#0b0f14] rounded-xl p-3 flex items-center gap-3 mb-4">
                <img src={(p.images&&p.images[0])||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="%23f5f0eb"><rect width="48" height="48"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="10" fill="%23bbb">Item</text></svg>')} className="w-12 h-12 rounded-lg object-cover" alt=""/>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium text-[#e2e8f0] truncate">{p.name}</p>
                  <p className="text-xs text-[#818cf8] font-bold">₹{p.price.toLocaleString('en-IN')}</p>
                </div>
              </div>
              <label className="text-xs font-medium text-[#64748b] mb-1 block">Quantity</label>
              <input type="number" value={inquiryQty} onChange={e=>setInquiryQty(e.target.value)} min="1" className="w-full bg-[#0b0f14] rounded-xl px-4 py-3 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-[#6366f1]/20"/>
              <label className="text-xs font-medium text-[#64748b] mb-1 block">Your message</label>
              <textarea value={inquiryMsg} onChange={e=>setInquiryMsg(e.target.value)} rows={3} placeholder={"e.g. I'd like to order 25 pieces for my store..."}
                className="w-full bg-[#0b0f14] rounded-xl px-4 py-3 text-sm mb-4 resize-none focus:outline-none focus:ring-2 focus:ring-[#6366f1]/20"/>
              <div className="flex gap-3">
                <button onClick={()=>{setShowInquiry(false);setInquirySent(false);}} className="flex-1 py-3 rounded-xl font-medium text-[#64748b] border border-[#1e293b]">Cancel</button>
                <button onClick={()=>{setInquirySent(true);try{const inq={id:Date.now(),product:p.name,artisan:artisan?.name||p.artisanName,qty:parseInt(inquiryQty)||1,message:inquiryMsg,buyer:'Buyer',date:new Date().toISOString(),status:'New'};const existing=JSON.parse(localStorage.getItem('kalasetu_inquiries')||'[]');existing.unshift(inq);localStorage.setItem('kalasetu_inquiries',JSON.stringify(existing));}catch(e){}}} disabled={!inquiryMsg.trim()} className="flex-1 py-3 rounded-xl font-semibold text-[#f1f5f9] bg-[#6366f1] disabled:bg-[#151e29] disabled:text-[#64748b] flex items-center justify-center gap-2"><Icon name="send" size={16}/> Send Inquiry</button>
              </div>
            </>}
          </div>
        </div>
      )}
    </div>
  );
};

// ==================== ARTISAN DETAIL (BUYER VIEW) ====================
const ArtisanDetail=()=>{
  const {selectedArtisan,setPage,setSelectedProduct,myProducts}=useContext(AppContext);
  const a=selectedArtisan;
  if(!a)return null;
  const allProducts=[...PRODUCTS,...(myProducts||[])];
  const products=allProducts.filter(p=>p.artisanId===a.id);

  return (
    <div className="pb-8">
      <div className="px-5 pt-12 pb-6 bg-gradient-to-b from-[#6366f1]/5 to-[#0b0f14]">
        <button onClick={()=>setPage('home')} className="flex items-center gap-2 text-[#64748b] mb-6">
          <Icon name="arrowLeft" size={20}/> Back
        </button>
        <div className="text-center">
          <img src={a.photo} className="w-24 h-24 rounded-full mx-auto mb-3 object-cover shadow-elevated" alt={a.name}/>
          <h1 className="text-2xl font-bold text-[#e2e8f0]">{a.name}</h1>
          <p className="text-sm text-[#64748b] mt-1">{a.craft}</p>
          <p className="text-xs text-[#64748b] mt-1 flex items-center justify-center gap-1"><Icon name="mapPin" size={12}/> {a.region}</p>
          <div className="mt-2 flex justify-center"><VerifiedBadge size="md"/></div>
          <div className="flex justify-center gap-4 mt-4 text-center">
            <div><p className="font-bold text-[#e2e8f0]">{a.yearsExp}+</p><p className="text-[10px] text-[#64748b]">Years</p></div>
            <div><p className="font-bold text-[#e2e8f0]">{products.length}</p><p className="text-[10px] text-[#64748b]">Products</p></div>
          </div>
        </div>
      </div>

      <div className="px-5 pt-5">
        <div className="bg-[#151e29] rounded-xl p-5 shadow-card mb-6">
          <h3 className="font-semibold text-[#e2e8f0] mb-2">My Story</h3>
          <p className="text-sm text-[#64748b] leading-relaxed italic">"{a.story}"</p>
        </div>

        {/* Trust & Authenticity */}
        <div className="bg-[#0e2f38] rounded-xl p-4 border border-[#22d3ee]/20 mb-6">
          <p className="text-xs font-semibold text-[#22d3ee] mb-3 uppercase tracking-wide">Craft Story & Origin</p>
          <div className="space-y-2.5">
            {[
              {icon:'shield',text:'Artisan identity verified'},
              {icon:'check',text:'Craft profile verified'},
              {icon:'mapPin',text:`Region: ${a.region}`},
              {icon:'user',text:'Artisan story shared'},
            ].map((item,i)=>(
              <div key={i} className="flex items-center gap-2.5 text-sm text-[#22d3ee]">
                <div className="w-6 h-6 bg-[#0e2f38] rounded-lg flex items-center justify-center"><Icon name={item.icon} size={12} className="text-[#22d3ee]"/></div>
                {item.text}
              </div>
            ))}
          </div>
        </div>

        <h3 className="font-semibold text-[#e2e8f0] mb-3">Products by {a.name.split(' ')[0]}</h3>
        <div className="grid grid-cols-2 gap-3">
          {products.map(p=>(
            <ProductCard key={p.id} product={p} onClick={()=>{setSelectedProduct(p);setPage('productDetail');}}/>
          ))}
        </div>
      </div>
    </div>
  );
};

// ==================== BUYER CART ====================
const BuyerCart=()=>{
  const {cart,removeFromCart,setPage}=useContext(AppContext);
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);

  if(cart.length===0){
    return (
      <div className="px-5 pt-12 flex flex-col items-center justify-center min-h-[70vh] text-center">
        <div className="text-5xl mb-4">🛒</div>
        <h2 className="text-xl font-bold text-[#e2e8f0] mb-2">Your cart is empty</h2>
        <p className="text-sm text-[#64748b] mb-6">Discover handmade crafts from artisans across India</p>
        <button onClick={()=>setPage('home')} className="btn-primary">Start Shopping</button>
      </div>
    );
  }

  return (
    <div className="px-5 pt-12 pb-32">
      <h1 className="font-display text-[24px] font-bold text-[#f1f5f9] mb-1 tracking-tight">Your Cart</h1>
      <p className="text-[#64748b] text-sm mb-6">{cart.length} item{cart.length>1?'s':''}</p>

      <div className="space-y-3 mb-6">
        {cart.map(item=>{
          const artisan=ARTISANS.find(a=>a.id===item.artisanId);
          return (
            <div key={item.id} className="bg-[#151e29] rounded-xl p-3 flex gap-3 shadow-card">
              <img src={(item.images&&item.images[0])||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="%23f5f0eb"><rect width="80" height="80"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="12" fill="%23bbb">Item</text></svg>')} className="w-20 h-20 rounded-xl object-cover" alt={item.name}/>
              <div className="flex-1 min-w-0">
                <p className="font-medium text-sm text-[#e2e8f0] truncate">{item.name}</p>
                <p className="text-xs text-[#64748b]">{artisan?.name}</p>
                <div className="flex items-center justify-between mt-2">
                  <p className="text-sm font-bold text-[#818cf8]">₹{item.price.toLocaleString('en-IN')}</p>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-[#64748b]">Qty: {item.qty}</span>
                    <button onClick={()=>removeFromCart(item.id)} className="text-[#475569] hover:text-red-400">
                      <Icon name="trash" size={14}/>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="bg-[#151e29] rounded-xl p-4 shadow-card mb-4">
        <div className="flex justify-between text-sm mb-2"><span className="text-[#64748b]">Subtotal</span><span className="font-medium">₹{total.toLocaleString('en-IN')}</span></div>
        <div className="flex justify-between text-sm mb-2"><span className="text-[#64748b]">Shipping</span><span className="font-medium text-[#22d3ee]">Free</span></div>
        <div className="border-t border-[#1e293b] pt-2 mt-2 flex justify-between"><span className="font-semibold">Total</span><span className="font-bold text-[#818cf8] text-lg">₹{total.toLocaleString('en-IN')}</span></div>
      </div>

      <button onClick={()=>setPage('checkout')} className="w-full py-[18px] rounded-xl font-semibold text-[15px] bg-[#6366f1] text-[#f1f5f9] shadow-elevated active:scale-[.98]">
        Proceed to Checkout
      </button>
    </div>
  );
};

// ==================== CHECKOUT ====================
const CheckoutPage=()=>{
  const {cart,placeOrder,setPage}=useContext(AppContext);
  const [address,setAddress]=useState('123, MG Road, Mumbai');
  const [phone,setPhone]=useState('9876543210');
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);

  const handlePlace=()=>{
    placeOrder();
  };

  return (
    <div className="px-5 pt-12 pb-8">
      <button onClick={()=>setPage('cart')} className="flex items-center gap-2 text-[#64748b] mb-6">
        <Icon name="arrowLeft" size={20}/> Back
      </button>
      <h1 className="font-display text-[24px] font-bold text-[#f1f5f9] mb-6 tracking-tight">Checkout</h1>

      <div className="space-y-4 mb-6">
        <div className="bg-[#151e29] rounded-xl p-4 shadow-card">
          <label className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-2 block">Delivery Address</label>
          <input value={address} onChange={e=>setAddress(e.target.value)} className="w-full bg-[#0b0f14] rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6366f1]/20"/>
        </div>
        <div className="bg-[#151e29] rounded-xl p-4 shadow-card">
          <label className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-2 block">Phone Number</label>
          <input value={phone} onChange={e=>setPhone(e.target.value)} className="w-full bg-[#0b0f14] rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6366f1]/20"/>
        </div>
      </div>

      <div className="bg-[#151e29] rounded-xl p-4 shadow-card mb-6">
        <p className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-3">Order Summary</p>
        {cart.map(item=>(
          <div key={item.id} className="flex justify-between text-sm py-2 border-b border-[#1e293b] last:border-0">
            <span className="text-[#64748b] truncate flex-1">{item.name} × {item.qty}</span>
            <span className="font-medium ml-2">₹{(item.price*item.qty).toLocaleString('en-IN')}</span>
          </div>
        ))}
        <div className="flex justify-between pt-3 mt-1"><span className="font-semibold">Total</span><span className="font-bold text-[#818cf8] text-lg">₹{total.toLocaleString('en-IN')}</span></div>
      </div>

      <div className="bg-[#151e29] rounded-xl p-4 shadow-card mb-6">
        <p className="text-xs font-medium text-[#64748b] uppercase tracking-wide mb-3">Payment Method</p>
        <div className="bg-[#0e2f38] rounded-xl p-3 border border-[#164e63] flex items-center gap-3">
          <Icon name="rupee" size={18} className="text-[#22d3ee]"/>
          <div>
            <p className="text-sm font-medium text-[#e2e8f0]">Demo Payment</p>
            <p className="text-xs text-[#64748b]">No real payment will be charged</p>
          </div>
          <div className="ml-auto w-5 h-5 rounded-full border-4 border-[#6366f1]/50 flex items-center justify-center"/>
        </div>
      </div>

      <button onClick={handlePlace} className="w-full py-[18px] rounded-xl font-semibold text-[15px] bg-[#6366f1] text-[#f1f5f9] shadow-elevated active:scale-[.98]">
        Place Order — ₹{total.toLocaleString('en-IN')}
      </button>
    </div>
  );
};

// ==================== ORDER CONFIRMED ====================
const OrderConfirmed=()=>{
  const {setPage,orders}=useContext(AppContext);
  const orderNum=(orders&&orders[0]?orders[0].id:window.__lastOrderNum)||'KS'+Date.now().toString(36).toUpperCase().slice(0,6);

  return (
    <div className="px-5 pt-12 pb-8 flex flex-col items-center justify-center min-h-[80vh] text-center">
      <div className="mb-6 animate-bounce-in">
        <div className="text-6xl">🎉</div>
      </div>
      <h1 className="font-display text-[26px] font-bold text-[#f1f5f9] mb-2 animate-slide-up tracking-tight">Order Placed!</h1>
      <p className="text-[#64748b] mb-6 animate-slide-up delay-100">Your handmade craft is on its way.</p>

      <div className="bg-[#151e29] rounded-xl p-5 shadow-card w-full mb-6 animate-scale-in delay-200">
        <div className="space-y-3 text-sm">
          <div className="flex justify-between"><span className="text-[#64748b]">Order</span><span className="font-mono font-medium">{orderNum}</span></div>
          <div className="flex justify-between"><span className="text-[#64748b]">Payment</span><span className="font-medium">Demo Payment</span></div>
          <div className="flex justify-between"><span className="text-[#64748b]">Est. Delivery</span><span className="font-medium">5-7 business days</span></div>
        </div>
      </div>

      <p className="text-xs text-[#64748b] mb-6 animate-fade-in delay-300">The artisan will prepare your order with care 🧵</p>

      <button onClick={()=>setPage('home')} className="w-full py-4 rounded-xl font-semibold bg-[#6366f1] text-[#f1f5f9] shadow-elevated animate-slide-up delay-400">
        Continue Shopping
      </button>
    </div>
  );
};

// ==================== BUYER ORDERS ====================
const BuyerOrdersPage=()=>{
  const {orders}=useContext(AppContext);
  return (
    <div className="px-5 lg:px-8 pt-12 lg:pt-20">
      <h1 className="text-2xl font-bold text-[#f1f5f9] mb-6">Your Orders</h1>
      {orders.length===0?(
        <div className="text-center py-16 text-[#64748b]">
          <Icon name="package" size={48} className="mx-auto mb-4 opacity-40"/>
          <p className="text-sm">No orders yet</p>
          <p className="text-xs mt-1">Start exploring handmade crafts!</p>
        </div>
      ):(
        <div className="space-y-3">

            <div key={o.id} className="bg-[#151e29] rounded-xl p-4 shadow-card animate-slide-up" style={{animationDelay:`${i*50}ms`}}>
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-mono text-[#64748b]">{o.id}</span>
                <span className="text-xs px-2 py-0.5 rounded-full bg-[#0e2f38] text-[#22d3ee] font-medium">{o.status}</span>
              </div>
              {o.items.map(item=>(
                <div key={item.id} className="flex gap-3 py-2">
                  <img src={(item.images&&item.images[0])||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="%23f5f0eb"><rect width="48" height="48"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="10" fill="%23bbb">Item</text></svg>')} className="w-12 h-12 rounded-lg object-cover" alt={item.name}/>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium text-[#e2e8f0] truncate">{item.name}</p>
                    <p className="text-xs text-[#64748b]">Qty: {item.qty}</p>

              ))}
              <div className="flex justify-between pt-2 border-t border-[#1e293b] mt-2">
                <span className="text-xs text-[#64748b]">{o.date}</span>
                <span className="font-bold text-[#818cf8]">₹{o.total.toLocaleString('en-IN')}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

    <div className="px-5 lg:px-8 pt-12 lg:pt-20 max-w-2xl mx-auto pb-20">

        <div className="w-20 h-20 bg-gradient-to-br from-[#818cf8] to-[#6366f1] rounded-full mx-auto mb-3 flex items-center justify-center text-[#f1f5f9] text-2xl font-bold">
          B

          {icon:'user',label:'Account Settings',action:()=>showNotif('Settings coming soon!')},
          {icon:'translate',label:'Language',action:()=>showNotif('Language settings coming soon!')},
          {icon:'message',label:'Help & Support',action:()=>showNotif('Support: help@kalasetu.com')},
        ].map((item,i)=>(
          <div key={i} onClick={item.action} className="bg-[#151e29] rounded-xl px-4 py-3.5 flex items-center gap-3 shadow-card cursor-pointer active:scale-[.98] transition-transform hover:bg-[#1b2634]">
            <Icon name={item.icon} size={18} className="text-[#818cf8]"/>
            <span className="flex-1 text-sm font-medium text-[#e2e8f0]">{item.label}</span>
