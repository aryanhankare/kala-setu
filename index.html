const AI={
  analyzeProduct:(photoDesc,voiceDesc)=>{
    const category=voiceDesc.toLowerCase().includes("saree")||voiceDesc.toLowerCase().includes("weav")?"Textiles":
                   voiceDesc.toLowerCase().includes("pottery")||voiceDesc.toLowerCase().includes("clay")?"Pottery":
                   voiceDesc.toLowerCase().includes("jewel")||voiceDesc.toLowerCase().includes("silver")?"Jewellery":
                   voiceDesc.toLowerCase().includes("bamboo")?"Bamboo":
                   voiceDesc.toLowerCase().includes("wood")?"Woodwork":
                   voiceDesc.toLowerCase().includes("embroid")?"Textiles":"Textiles";
    const lower=voiceDesc.toLowerCase();
    const sub=lower.includes("saree")?"Sarees":
              lower.includes("dupatta")?"Dupattas":
              lower.includes("scarf")||lower.includes("stole")?"Stoles":
              lower.includes("basket")?"Baskets":
              lower.includes("lamp")?"Lamps":
              lower.includes("necklace")?"Necklaces":
              lower.includes("earring")?"Earrings":
              lower.includes("plate")?"Plates":
              lower.includes("cushion")?"Cushions":
              lower.includes("bowl")?"Bowls":
              lower.includes("box")?"Boxes":
              lower.includes("bedsheet")?"Bedsheets":"General";
    const title=lower.includes("saree")?"Traditional Handwoven Cotton Saree":
                lower.includes("dupatta")?"Hand-Embroidered Silk Dupatta":
                lower.includes("scarf")||lower.includes("stole")?"Handwoven Cotton Stole":
                lower.includes("basket")?"Handwoven Bamboo Storage Basket":
                lower.includes("lamp")?"Handcrafted Table Lamp":
                lower.includes("necklace")?"Handcrafted Silver Necklace":
                lower.includes("earring")?"Traditional Silver Earrings":
                lower.includes("plate")?"Hand-Engraved Decorative Plate":
                lower.includes("cushion")?"Embroidered Cushion Cover Set":
                lower.includes("bowl")?"Handcrafted Terracotta Bowl Set":
                lower.includes("box")?"Hand-Carved Sandalwood Box":
                lower.includes("bedsheet")||lower.includes("bed")?"Block Printed Cotton Bedsheet":
                lower.includes("fabric")||lower.includes("cloth")?"Handwoven Cotton Fabric":"Handcrafted Artisan Product";
    return {
      identified: title,
      category:`${category} → ${sub}`,
      title: title,
      description: voiceDesc.length>50?voiceDesc.substring(0,120)+"...":`A beautiful handmade ${title.toLowerCase()} crafted with care using traditional techniques. Each piece reflects the artisan's skill and heritage.`,
      materials: lower.includes("dupatta")||lower.includes("silk")?["Silk","Hand-embroidered","Cotton thread"]:
                 category==="Textiles"?(lower.includes("cotton")?["Cotton","Natural dyes","Handwoven"]:["Silk","Handwoven","Natural dyes"]):
                 category==="Bamboo"?["Natural bamboo","Handwoven"]:
                 category==="Pottery"?["Terracotta clay","Natural pigments"]:
                 category==="Jewellery"?(lower.includes("silver")?["Sterling silver","Handcrafted","Filigree"]:["Gold-plated silver","Handcrafted"]):
                 category==="Woodwork"?(lower.includes("sandalwood")?["Sandalwood","Brass","Hand-carved"]:["Rosewood","Hand-carved"]):["Brass","Hand-engraved"],
      tags:[category==="Textiles"?"Handloom":"Handmade","Traditional","Handcrafted","India",category],
      price: lower.includes("silk")||lower.includes("dupatta")?3200:lower.includes("necklace")||lower.includes("jewel")?4500:category==="Textiles"?2800:category==="Bamboo"?1500:category==="Pottery"?1800:category==="Jewellery"?3500:category==="Woodwork"?4200:2500,
      minPrice: lower.includes("silk")||lower.includes("dupatta")?2600:lower.includes("necklace")||lower.includes("jewel")?3800:category=="Textiles"?2400:category=="Bamboo"?1200:category=="Pottery"?1400:category=="Jewellery"?3000:category=="Woodwork"?3500:2000,
      maxPrice: lower.includes("silk")||lower.includes("dupatta")?3800:lower.includes("necklace")||lower.includes("jewel")?5500:category=="Textiles"?3500:category=="Bamboo"?1800:category=="Pottery"?2200:category=="Jewellery"?4500:category=="Woodwork"?5000:3000,
    };
  },

    {icon:"💡",text:"Similar sarees are selling between ₹2,800–₹3,600",type:"pricing"},
    {icon:"📸",text:"Listings with clear product photos receive 3x more views",type:"tip"},
  ],
  chat:(msg)=>{
    const lower=msg.toLowerCase();
    if(lower.includes("price"))return "Based on similar handmade products, I'd suggest pricing between ₹2,400 and ₹3,200. This accounts for material cost, your time, and current market demand. Would you like me to analyze a specific product?";
    if(lower.includes("order"))return "You've received 24 orders this month — that's up 18% from last month! Your handloom products are the most popular. Keep up the great work! 🎉";
    if(lower.includes("photo")||lower.includes("image"))return "Clear product photos make a big difference! I recommend using natural light, a simple background, and showing the product from multiple angles. Would you like me to enhance your current photos?";
    if(lower.includes("translat"))return "I can translate your product listings into Hindi, Marathi, Bengali, Tamil, and more. This helps buyers from different regions discover your crafts. Which product would you like me to translate?";
    if(lower.includes("improve")||lower.includes("listing"))return "I'd be happy to help improve your listings! Common improvements include: clearer descriptions, better photos, more detailed materials info, and competitive pricing. Which listing would you like to work on?";
    if(lower.includes("next")||lower.includes("make"))return "Based on current market trends, handwoven textiles and traditional jewellery are in high demand. Cotton products and natural-dye items are trending especially well right now. 📊";
    if(lower.includes("hello")||lower.includes("hi")||lower.includes("help"))return "Namaste! 🙏 I'm KalaSetu AI, your digital business assistant. I can help you with pricing, translations, improving listings, understanding orders, and growing your craft business. What would you like to know?";
    return "That's a great question! I can help you with pricing your products, translating listings, improving your product photos, analyzing your sales, and suggesting what to make next. Just ask me anything about your craft business! 🎨";
  }
};

const App=()=>{
  const [role,setRole]=useState(null);
  const [page,setPage]=useState('home');
  const [lang,setLang]=useState('en');
  const [cart,setCart]=useState([]);
  const [orders,setOrders]=useState([]);
  const [myProducts,setMyProducts]=useState(()=>{try{const s=localStorage.getItem('kalasetu_products');return s?JSON.parse(s):[];}catch(e){return [];}});
  const [selectedProduct,setSelectedProduct]=useState(null);
  const [selectedArtisan,setSelectedArtisan]=useState(null);
  const [catFlow,setCatFlow]=useState({step:0,photoDesc:'',voiceDesc:'',result:null,enhanced:false,finalPrice:0});
  const [notification,setNotification]=useState(null);
  const [artisanProfile,setArtisanProfile]=useState({name:'',craft:'',village:'',district:'',state:'',photo:'',story:'',language:'Hindi'});
  const [onboarded,setOnboarded]=useState(false);
  const [searchQuery,setSearchQuery]=useState('');
  const [selectedCategory,setSelectedCategory]=useState(null);
  const [selectedRegion,setSelectedRegion]=useState(null);
  const [showLangMenu,setShowLangMenu]=useState(false);
  const [wishlist,setWishlist]=useState([]);
  const toggleWishlist=(id)=>setWishlist(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);

  const addToCart=(product)=>{
    setCart(prev=>{
      const exists=prev.find(c=>c.id===product.id);
      if(exists)return prev.map(c=>c.id===product.id?{...c,qty:c.qty+1}:c);
      return [...prev,{...product,qty:1}];
    });
    showNotif("Added to cart! 🛒");
  };

  const removeFromCart=(id)=>setCart(prev=>prev.filter(c=>c.id!==id));

  const placeOrder=()=>{
    const orderNum="KS"+Date.now().toString(36).toUpperCase();
    const newOrder={
      id:orderNum,
      items:[...cart],
      total:cart.reduce((s,c)=>s+c.price*c.qty,0),
      date:new Date().toLocaleDateString('en-IN'),
      status:'New',
      address:"Demo Address, India",
      phone:"9876543210"
    };
    setOrders(prev=>[newOrder,...prev]);
    setCart([]);
    setPage('orderConfirmed');
    return orderNum;
  };

  const showNotif=(msg)=>{
    setNotification(msg);
    setTimeout(()=>setNotification(null),2500);
  };

  const val={
    role,setRole,page,setPage,lang,setLang,cart,setCart,orders,setOrders,
    myProducts,setMyProducts,selectedProduct,setSelectedProduct,
    selectedArtisan,setSelectedArtisan,catFlow,setCatFlow,
    artisanProfile,setArtisanProfile,onboarded,setOnboarded,
    addToCart,removeFromCart,placeOrder,showNotif,
    searchQuery,setSearchQuery,selectedCategory,setSelectedCategory,
    selectedRegion,setSelectedRegion,showLangMenu,setShowLangMenu,
    wishlist,toggleWishlist,
  };

  return (
    <AppContext.Provider value={val}>
      <div className="mobile-frame">
        {notification&&(
          <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-forest-600 text-white px-5 py-3 rounded-2xl text-sm font-medium card-shadow-lg animate-slide-up" style={{maxWidth:360}}>
            {notification}
          </div>
        )}
        {!role?<LandingPage/>:
          role==='artisan'?
            (onboarded?<ArtisanApp/>:<OnboardingFlow/>):
            <BuyerApp/>
        }
      </div>
    </AppContext.Provider>
  );
};

    </div>
  );
};

// ==================== ADD PRODUCT FLOW ====================
const AddProductFlow=()=>{
  const {catFlow,setCatFlow,setPage,showNotif,artisanProfile,setMyProducts}=useContext(AppContext);
  const [voiceText,setVoiceText]=useState("");
  const [isRecording,setIsRecording]=useState(false);
  const [photoUploaded,setPhotoUploaded]=useState(false);
  const [photoData,setPhotoData]=useState(null);
  const [language,setLanguage]=useState('en');
  const [editedPrice,setEditedPrice]=useState('');
  const [editedTitle,setEditedTitle]=useState('');
  const [editedDesc,setEditedDesc]=useState('');
  const [editedMaterials,setEditedMaterials]=useState([]);
  const [editedTags,setEditedTags]=useState([]);
  const [showEnhance,setShowEnhance]=useState(false);
  const [enhanced,setEnhanced]=useState(false);
  const [publishStep,setPublishStep]=useState(0);
  const [isAnalyzing,setIsAnalyzing]=useState(false);
  const [analyzeError,setAnalyzeError]=useState(null);
  const fileInputRef=React.useRef(null);

  // --- REAL IMAGE UPLOAD ---
  const handlePhotoSelect=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const allowed=['image/jpeg','image/jpg','image/png','image/webp'];
    if(!allowed.includes(file.type)){
      showNotif('Please select a JPG, PNG or WEBP image');
      return;
    }
    if(file.size>10*1024*1024){
      showNotif('Image must be under 10MB');
      return;
    }
    const reader=new FileReader();
    reader.onload=()=>{
      setPhotoData(reader.result);
      setPhotoUploaded(true);
      setAnalyzeError(null);
    };
    reader.readAsDataURL(file);
  };

  // --- REAL AI ANALYSIS WITH FALLBACK ---
  const runAnalysis=async(photoData,voiceDesc)=>{
    setIsAnalyzing(true);
    setAnalyzeError(null);
    setCatFlow(p=>({...p,step:1}));
    try{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),8000);
      const resp=await fetch('/api/analyze',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:photoData,description:voiceDesc||''}),
        signal:controller.signal
      });
      clearTimeout(timeout);
      if(!resp.ok){
        const errData=await resp.json().catch(()=>({}));
        throw new Error(errData.error||'AI service unavailable');
      }
      const result=await resp.json();
      setCatFlow(p=>({...p,step:2,result,finalPrice:result.price}));
      setEditedTitle(result.title);
      setEditedDesc(result.description);
      setEditedPrice(String(result.price));
      setEditedMaterials([...result.materials]);
      setEditedTags([...result.tags]);
      setIsAnalyzing(false);
    }catch(err){
      console.warn('Real AI failed, using fallback:',err.message);
      const fallback=AI.analyzeProduct('photo',voiceDesc||'handwoven cotton saree traditional weaving');
      setCatFlow(p=>({...p,step:2,result:fallback,finalPrice:fallback.price}));
      setEditedTitle(fallback.title);
      setEditedDesc(fallback.description);
      setEditedPrice(String(fallback.price));
      setEditedMaterials([...fallback.materials]);
      setEditedTags([...fallback.tags]);
      setIsAnalyzing(false);
      setAnalyzeError('Using offline mode \u2014 AI service unavailable');
    }
  };

  const exampleTranscripts=[
    "This is a handwoven cotton saree. I made it by hand using traditional weaving techniques. It took me about 8 days to complete.",
    "A beautiful terracotta sculpture of a Rajasthani camel. I shaped this by hand from local clay and fired it in a traditional kiln.",
    "Hand-embroidered silk dupatta with traditional Moti-kaam threadwork. Each piece takes about 5 days to complete.",
    "A handwoven bamboo basket, traditionally used in Assamese households. Sustainable and durable.",
  ];
  const recognitionRef=React.useRef(null);

  const handleVoiceDemo=()=>{
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SpeechRecognition&&!isRecording){
      try{
        const recognition=new SpeechRecognition();
        recognition.continuous=false;
        recognition.interimResults=false;
        recognition.lang=language==='hi'?'hi-IN':language==='mr'?'mr-IN':'en-IN';
        recognition.onresult=(event)=>{
          const transcript=event.results[0][0].transcript;
          setVoiceText(prev=>prev?(prev+' '+transcript):transcript);
          setIsRecording(false);
        };
        recognition.onerror=()=>{
          setIsRecording(false);
          // Fallback to demo transcript on error
          const transcript=exampleTranscripts[Math.floor(Math.random()*exampleTranscripts.length)];
          setVoiceText(transcript);
          showNotif('Voice demo used — speech recognition not available');
        };
        recognition.onend=()=>{setIsRecording(false);};
        recognitionRef.current=recognition;
        recognition.start();
        setIsRecording(true);
      }catch(e){
        // Fallback to demo
        setIsRecording(true);
        setTimeout(()=>{
          const transcript=exampleTranscripts[Math.floor(Math.random()*exampleTranscripts.length)];
          setVoiceText(transcript);
          setIsRecording(false);
        },2000);
      }
    }else if(isRecording&&recognitionRef.current){
      recognitionRef.current.stop();
      setIsRecording(false);
    }else{
      // Fallback demo when no speech recognition available
      setIsRecording(true);
      setTimeout(()=>{
        const transcript=exampleTranscripts[Math.floor(Math.random()*exampleTranscripts.length)];
        setVoiceText(transcript);
        setIsRecording(false);
      },2000);
    }
  };



  const handlePublish=()=>{
    setPublishStep(1);
    const catStr=(catFlow.result&&catFlow.result.category)||'Other';
    const catParts=catStr.split('\\u2192').map(s=>s.trim());
    const newProduct={
      id:Date.now(),
      artisanId:0,
      name:editedTitle,
      category:catParts[0]||'Other',
      subcategory:catParts[1]||'General',
      price:parseInt(editedPrice)||0,
      minPrice:(catFlow.result&&catFlow.result.minPrice)||0,
      maxPrice:(catFlow.result&&catFlow.result.maxPrice)||0,
      description:editedDesc,
      materials:[...editedMaterials],
      tags:[...editedTags],
      images:photoData?[photoData]:[],
      region:artisanProfile.state||artisanProfile.village||'India',
      available:true,
      artisanName:artisanProfile.name||'Artisan',
      artisanLocation:(artisanProfile.village||'')+', '+(artisanProfile.state||''),
      createdAt:new Date().toISOString(),
      published:true
    };
    setMyProducts(prev=>[newProduct,...prev]);
    try{
      const existing=JSON.parse(localStorage.getItem('kalasetu_products')||'[]');
      existing.unshift(newProduct);
      localStorage.setItem('kalasetu_products',JSON.stringify(existing));
    }catch(e){console.warn('localStorage save failed',e);}
    setTimeout(()=>{
      setPublishStep(2);
    },1500);
  };

  if(catFlow.step===0){
    return (
      <div className="px-5 pt-12 animate-slide-up">
        <button onClick={()=>{setCatFlow({step:0,photoDesc:'',voiceDesc:'',result:null,enhanced:false,finalPrice:0});setPage('home');}} className="flex items-center gap-2 text-warm-500 mb-6">
          <Icon name="arrowLeft" size={20}/> Back
        </button>
        <h1 className="text-2xl font-bold text-terra-800 mb-2">Add your craft</h1>
        <p className="text-warm-500 mb-8">Take a photo and tell us about your product. We'll help create the listing.</p>

        <div className="space-y-4 mb-8">
          <input ref={fileInputRef} type="file" accept="image/jpeg,image/jpg,image/png,image/webp" onChange={handlePhotoSelect} className="hidden"/>
          <button onClick={()=>fileInputRef.current?.click()} className={`w-full border-2 border-dashed rounded-2xl ${photoUploaded?'py-4':'py-8'} flex flex-col items-center gap-3 transition-all ${photoUploaded?'border-forest-400 bg-forest-50':'border-warm-200 bg-white hover:border-terra-300'}`}>            {photoUploaded&&photoData?(
              <>
                <img src={photoData} alt="Uploaded product" className="w-full h-40 object-cover rounded-xl"/>
                <div className="flex items-center gap-2">
                  <Icon name="check" size={16} className="text-forest-600"/>
                  <p className="font-semibold text-forest-700 text-sm">Photo uploaded — tap to change</p>
                </div>
              </>
            ):photoUploaded?(
              <>
                <div className="w-14 h-14 rounded-2xl flex items-center justify-center bg-forest-100 text-forest-600">
                  <Icon name="check" size={28}/>
                </div>
                <p className="font-semibold text-forest-700">Photo uploaded ✓</p>
              </>
            ):(
              <>
                <div className="w-14 h-14 rounded-2xl flex items-center justify-center bg-warm-100 text-warm-400">
                  <Icon name="camera" size={28}/>
                </div>
                <div>
                  <p className="font-semibold text-warm-700">Upload / Take Photos</p>
                  <p className="text-xs text-warm-400 mt-1">Tap to select from gallery or camera</p>
                </div>
              </>
            )}
          </button>

          <div className="bg-white rounded-2xl p-5 card-shadow">
            <label className="text-sm font-medium text-warm-700 mb-3 block flex items-center gap-2">
              <Icon name="mic" size={16} className="text-terra-500"/> {isRecording?'Speak now... 🎙️':'Tell us about your craft'}
            </label>
            <p className="text-xs text-warm-400 mb-3">{isRecording?'Listening in '+language.toUpperCase()+' — tap mic to stop':'Speak or type in any language (Hindi, Marathi, English)'}</p>
            <textarea value={voiceText} onChange={e=>setVoiceText(e.target.value)} rows={4} placeholder='Example: "This is a handwoven cotton saree..."'
              className="w-full text-sm text-warm-700 placeholder-warm-300 resize-none focus:outline-none mb-3"/>
            <div className="flex gap-2">
              <button onClick={handleVoiceDemo} className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl font-medium text-sm transition-all ${isRecording?'bg-red-50 text-red-600 border-2 border-red-200':'bg-terra-50 text-terra-600 border border-terra-100'}`}>
                <Icon name="mic" size={18}/> {isRecording?'Stop Recording 🎙️':'Tap to Speak'}
              </button>
            </div>
            {isRecording&&<div className="flex justify-center gap-2 mt-3"><span className="wave-dot"/><span className="wave-dot"/><span className="wave-dot"/></div>}
          </div>
        </div>

        {analyzeError&&(
          <div className="bg-mustard-50 border border-mustard-200 rounded-2xl p-4 mb-4 flex items-start gap-3 animate-slide-up">
            <span className="text-xl">⚠️</span>
            <div>
              <p className="text-sm font-medium text-mustard-800">{analyzeError}</p>
              <p className="text-xs text-mustard-600 mt-1">You can still review and edit the listing below.</p>
            </div>
          </div>
        )}
        <button onClick={()=>runAnalysis(photoData,voiceText)} disabled={!photoUploaded||isAnalyzing}
          className={`w-full py-4 rounded-2xl font-semibold text-lg transition-all flex items-center justify-center gap-2 ${photoUploaded?'bg-terra-500 text-white card-shadow-lg active:scale-[.97]':'bg-warm-200 text-warm-400 cursor-not-allowed'}`}>
          <Icon name="sparkles" size={20}/> {isAnalyzing?'Analyzing...':'AI Analyze Product'}
        </button>
      </div>
    );
  }

  if(catFlow.step===1){
    const steps=[
      {t:"Uploading image to AI...",delay:0},
      {t:"Analyzing visual details...",delay:1500},
      {t:"Identifying product type...",delay:3000},
      {t:"Suggesting materials & price...",delay:4500},
    ];
    return (
      <div className="px-5 pt-12 flex flex-col items-center justify-center min-h-[80vh]">
        <div className="animate-bounce-in mb-6">
          <div className="w-20 h-20 bg-gradient-to-br from-terra-400 to-mustard-400 rounded-full flex items-center justify-center">
            <Icon name="sparkles" size={36} className="text-white"/>
          </div>
        </div>
        <h2 className="text-xl font-bold text-terra-800 mb-2 animate-slide-up">Analyzing your craft...</h2>
        <p className="text-warm-400 text-sm mb-8 animate-slide-up delay-100">Our AI is examining your product photo</p>
        <div className="w-full max-w-xs space-y-3">
          {steps.map((s,i)=>(
            <div key={i} className="flex items-center gap-3 animate-fade-in" style={{animationDelay:`${s.delay}ms`}}>
              <div className="w-5 h-5 rounded-full bg-forest-100 flex items-center justify-center" style={{animationDelay:`${s.delay+300}ms`}}>
                <Icon name="check" size={12} className="text-forest-600"/>
              </div>
              <span className="text-sm text-warm-600">{s.t}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  if(catFlow.step===2&&catFlow.result){
    const r=catFlow.result;
    return (
      <div className="px-5 pt-12 pb-8">
        <div className="flex items-center justify-between mb-4">
          <button onClick={()=>{setAnalyzeError(null);setCatFlow({...catFlow,step:0});}} className="flex items-center gap-1 text-warm-500">
            <Icon name="arrowLeft" size={20}/> Back
          </button>
          <div className="flex items-center gap-2">
            <button onClick={()=>setLanguage(l=>l==='en'?'hi':l==='hi'?'mr':'en')}
              className="px-3 py-1.5 bg-warm-100 rounded-lg text-xs font-medium text-warm-600">
              {language==='en'?'EN':language==='hi'?'हिंदी':'मराठी'}
            </button>
            <button onClick={()=>setShowLangMenu&&setShowLangMenu(true)}
              className="px-3 py-1.5 bg-forest-50 rounded-lg text-xs font-medium text-forest-600 flex items-center gap-1 border border-forest-100">
              <Icon name="translate" size={12}/> Translate
            </button>
          </div>
        </div>

        <div className="bg-forest-50 border border-forest-200 rounded-2xl p-4 mb-5 flex items-start gap-3 animate-scale-in">
          <Icon name="sparkles" size={20} className="text-forest-600 mt-0.5"/>
          <div>
            <p className="font-semibold text-forest-700 text-sm">AI suggestions — review before publishing</p>
            <p className="text-xs text-forest-600 mt-0.5">Edit any field before publishing your product</p>
          </div>
        </div>

        <div className="space-y-4 mb-6">
          <div className="bg-white rounded-2xl p-4 card-shadow animate-slide-up">
            <label className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-2 block">AI identified</label>
            <p className="font-bold text-terra-700 text-lg">{r.identified}</p>
          </div>

          <div className="bg-white rounded-2xl p-4 card-shadow animate-slide-up delay-100">
            <label className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-2 block">Category</label>
            <p className="font-medium text-warm-700">{r.category}</p>
          </div>

          <div className="bg-white rounded-2xl p-4 card-shadow animate-slide-up delay-200">
            <label className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-2 block">Suggested title</label>
            <input value={editedTitle} onChange={e=>setEditedTitle(e.target.value)}
              className="w-full font-semibold text-warm-800 text-lg focus:outline-none bg-transparent border-b border-warm-200 pb-1"/>
          </div>

          <div className="bg-white rounded-2xl p-4 card-shadow animate-slide-up delay-300">
            <label className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-2 block">Description</label>
            <textarea value={editedDesc} onChange={e=>setEditedDesc(e.target.value)} rows={3}
              className="w-full text-sm text-warm-700 resize-none focus:outline-none bg-transparent"/>
          </div>

          <div className="bg-white rounded-2xl p-4 card-shadow animate-slide-up delay-400">
            <label className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-2 block">Materials (tap × to remove)</label>
            <div className="flex flex-wrap gap-2 mb-2">
              {editedMaterials.map((m,i)=>(
                <span key={i} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-terra-100 text-terra-700">
                  {m}
                  <button onClick={()=>setEditedMaterials(prev=>prev.filter((_,j)=>j!==i))} className="ml-0.5 text-terra-400 hover:text-red-500 text-sm leading-none">×</button>

            <div className="flex gap-2">
              <input id="addMaterial" placeholder="Add material..." className="flex-1 bg-warm-50 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-terra-300" onKeyDown={e=>{if(e.key==='Enter'&&e.target.value.trim()){setEditedMaterials(prev=>[...prev,e.target.value.trim()]);e.target.value='';}}} />
              <button onClick={()=>{const inp=document.getElementById('addMaterial');if(inp&&inp.value.trim()){setEditedMaterials(prev=>[...prev,inp.value.trim()]);inp.value='';}}} className="px-3 py-2 bg-terra-50 text-terra-600 rounded-lg text-sm font-medium border border-terra-100">Add</button>

            <div className="flex flex-wrap gap-2 mb-2">
              {editedTags.map((t,i)=>(
                <span key={i} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-warm-100 text-warm-700">

                  <button onClick={()=>setEditedTags(prev=>prev.filter((_,j)=>j!==i))} className="ml-0.5 text-warm-400 hover:text-red-500 text-sm leading-none">×</button>

        <div className="bg-white rounded-2xl overflow-hidden card-shadow-lg mb-6 animate-scale-in">

          <div className="p-5">

            <h3 className="font-bold text-lg text-warm-800 mb-1">{editedTitle}</h3>
            <p className="text-sm text-warm-500 mb-3">{r.category}</p>
            <p className="text-sm text-warm-600 mb-3">{editedDesc}</p>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {editedMaterials.map((m,i)=><Badge key={i} variant="terra">{m}</Badge>)}
            </div>
            <div className="flex items-center gap-2 text-sm text-warm-500 mb-1">
              <Icon name="user" size={14}/> {artisanProfile.name||'Artisan'}
            </div>
            <div className="flex items-center gap-2 text-sm text-warm-500 mb-3">

// ==================== AI ASSISTANT ====================
const AIAssistant=()=>{
  const [messages,setMessages]=useState([
    {from:'ai',text:"Namaste! 🙏 I'm KalaSetu AI, your digital business assistant. How can I help you today?"},
  ]);
  const [input,setInput]=useState('');
  const messagesEnd=useRef(null);

  useEffect(()=>{messagesEnd.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const quickActions=["Why am I not getting orders?","Suggest a price","Translate product","What should I make next?"];

  const send=(msg)=>{
    const text=msg||input;
    if(!text.trim())return;
    setMessages(p=>[...p,{from:'user',text}]);
    setInput('');
    setTimeout(()=>{
      setMessages(p=>[...p,{from:'ai',text:AI.chat(text)}]);
    },800);
  };

  return (
    <div className="flex flex-col h-screen bg-warm-50">
      <div className="bg-white border-b border-warm-100 px-5 pt-12 pb-4 flex items-center gap-3">
        <div className="w-10 h-10 bg-gradient-to-br from-forest-400 to-forest-600 rounded-xl flex items-center justify-center text-white">
          <Icon name="bot" size={20}/>
        </div>
        <div>
          <h2 className="font-bold text-warm-800">KalaSetu AI</h2>
          <p className="text-xs text-forest-500">Your digital business assistant</p>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-5 py-4 space-y-4 hide-scrollbar">
        {messages.map((m,i)=>(
          <div key={i} className={`flex ${m.from==='user'?'justify-end':'justify-start'}`}>
            <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm ${m.from==='user'?'bg-terra-500 text-white rounded-br-md':'bg-white text-warm-700 card-shadow rounded-bl-md'}`}>
              {m.text}
            </div>
          </div>
        ))}
        <div ref={messagesEnd}/>
      </div>

      {messages.length<=1&&(
        <div className="px-5 pb-2 flex flex-wrap gap-2">
          {quickActions.map((qa,i)=>(
            <button key={i} onClick={()=>send(qa)} className="text-xs bg-white border border-warm-200 text-warm-600 px-3 py-2 rounded-xl hover:bg-warm-50 transition-all">
              {qa}
            </button>
          ))}
        </div>
      )}

      <div className="px-5 py-3 bg-white border-t border-warm-100 flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder="Ask anything about your craft business..." className="flex-1 bg-warm-50 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-terra-200"/>
        <button onClick={()=>send()} className="w-11 h-11 bg-terra-500 rounded-xl flex items-center justify-center text-white">
          <Icon name="send" size={18}/>
        </button>
      </div>
    </div>
  );
};

const BuyerExplore=()=>{
  const {setPage,setSelectedProduct,setSelectedArtisan,searchQuery,setSearchQuery}=useContext(AppContext);
  const [selectedCat,setSelectedCat]=useState(null);
  const [selectedReg,setSelectedReg]=useState(null);
  const [priceRange,setPriceRange]=useState(null);

  let filtered=PRODUCTS;
  if(searchQuery)filtered=filtered.filter(p=>p.name.toLowerCase().includes(searchQuery.toLowerCase())||p.category.toLowerCase().includes(searchQuery.toLowerCase()));
  if(selectedCat)filtered=filtered.filter(p=>p.category===selectedCat);
  if(selectedReg)filtered=filtered.filter(p=>p.region===selectedReg);
  if(priceRange)filtered=filtered.filter(p=>p.price>=priceRange[0]&&p.price<=priceRange[1]);

  return (
    <div className="px-5 pt-12">
      <h1 className="text-2xl font-bold text-terra-800 mb-4">Explore</h1>

      <div className="bg-white rounded-2xl px-4 py-3 flex items-center gap-3 card-shadow mb-4">
        <Icon name="search" size={18} className="text-warm-400"/>
        <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Search crafts, products or artisans"
          className="flex-1 text-sm focus:outline-none"/>
        {searchQuery&&<button onClick={()=>setSearchQuery('')} className="text-warm-400 text-xs">Clear</button>}
      </div>

      {/* Filters */}
      <div className="flex gap-2 mb-4 overflow-x-auto hide-scrollbar pb-1">
        <button onClick={()=>{setSelectedCat(null);setSelectedReg(null);setPriceRange(null);}}
          className={`px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap border transition-all ${!selectedCat&&!selectedReg&&!priceRange?'bg-terra-500 text-white border-terra-500':'bg-white text-warm-600 border-warm-200'}`}>
          All
        </button>
        {CATEGORIES.map(c=>(
          <button key={c.name} onClick={()=>setSelectedCat(selectedCat===c.name?null:c.name)}
            className={`px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap border transition-all flex items-center gap-1 ${selectedCat===c.name?'bg-terra-500 text-white border-terra-500':'bg-white text-warm-600 border-warm-200'}`}>
            {c.icon} {c.name}
          </button>
        ))}
      </div>

      <div className="flex gap-2 mb-5">
        <select value={selectedReg||''} onChange={e=>setSelectedReg(e.target.value||null)}
          className="bg-white rounded-xl px-3 py-2 text-xs card-shadow border border-warm-100 focus:outline-none appearance-none">
          <option value="">All Regions</option>
          {REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
        </select>
        <select value={priceRange?`${priceRange[0]}-${priceRange[1]}`:''} onChange={e=>{
          const v=e.target.value;
          setPriceRange(v?[parseInt(v.split('-')[0]),parseInt(v.split('-')[1])]:null);
        }}
          className="bg-white rounded-xl px-3 py-2 text-xs card-shadow border border-warm-100 focus:outline-none appearance-none">
          <option value="">All Prices</option>
          <option value="0-1500">Under ₹1,500</option>
          <option value="1500-3000">₹1,500 - ₹3,000</option>
          <option value="3000-10000">Above ₹3,000</option>
        </select>
      </div>

      <p className="text-xs text-warm-400 mb-3">{filtered.length} products found</p>
      <div className="grid grid-cols-2 gap-3 pb-4">
        {filtered.map(p=>(
          <ProductCard key={p.id} product={p} onClick={()=>{setSelectedProduct(p);setPage('productDetail');}}/>
        ))}
      </div>
      {filtered.length===0&&(
        <div className="text-center py-12 text-warm-400">
          <Icon name="search" size={40} className="mx-auto mb-3 opacity-40"/>
          <p className="text-sm">No products match your filters</p>
        </div>
      )}
    </div>
  );
};

              {l:'Date Listed',v:p.createdAt?new Date(p.createdAt).toLocaleDateString('en-IN'):''},
            ].filter(x=>x.v).map((item,i)=>(
              <div key={i} className="flex justify-between text-xs">
                <span className="text-forest-500 font-medium">{item.l}</span>
                <span className="text-forest-700 text-right max-w-[60%] truncate">{item.v}</span>
              </div>
            ))}
          </div>
          <div className="mt-3 flex items-center gap-1.5 text-[10px] text-forest-400">
            <Icon name="check" size={10}/> This record documents information supplied through KalaSetu. It is not government or GI certification.
          </div>
        </div>

        {/* Reviews */}
        <div className="mb-6">
          <h3 className="font-semibold text-warm-800 mb-3">Buyer Reviews</h3>
          {[
            {name:"Priya S.",rating:5,text:"Beautiful craftsmanship! The quality exceeded my expectations. The saree is even more gorgeous in person.",date:"2 days ago"},
            {name:"Amit K.",rating:4,text:"Lovely handwoven work. The colors are vibrant and the fabric feels premium. Will buy again.",date:"1 week ago"},
            {name:"Neha G.",rating:5,text:"Amazing traditional art. You can see the artisan's dedication in every thread. Highly recommended!",date:"2 weeks ago"},
          ].map((r,i)=>(
            <div key={i} className="bg-white rounded-2xl p-4 card-shadow mb-3 animate-slide-up" style={{animationDelay:`${i*80}ms`}}>
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-terra-100 flex items-center justify-center text-terra-600 text-xs font-bold">{r.name.charAt(0)}</div>
                  <div>
                    <p className="text-sm font-medium text-warm-800">{r.name}</p>
                    <div className="flex gap-0.5">{Array.from({length:5},(_, si)=><span key={si} className={`text-xs ${si<r.rating?'text-mustard-400':'text-warm-200'}`}>★</span>)}</div>
                  </div>
                </div>
                <span className="text-[10px] text-warm-400">{r.date}</span>
              </div>
              <p className="text-sm text-warm-600">{r.text}</p>
            </div>
          ))}
        </div>

        {/* Recommendations */}
        {similar.length>0&&(
          <div className="mb-6">
            <h3 className="font-semibold text-warm-800 mb-3">Because you liked {p.subcategory||p.category}</h3>
            <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
              {similar.map(sp=>(
                <ProductCard key={sp.id} product={sp} compact onClick={()=>{}}/>
              ))}
            </div>
          </div>
        )}

        {/* Actions */}
        <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-warm-100 px-5 py-3 flex gap-3 z-10">
          <button onClick={()=>setShowInquiry(true)} className="flex-1 py-3.5 rounded-2xl font-semibold text-terra-600 border border-terra-200 bg-white flex items-center justify-center gap-2">
            <Icon name="message" size={18}/> Enquire
          </button>
          <button onClick={()=>{addToCart(p);showNotif("Added to cart! 🛒");}} className="flex-1 py-3.5 rounded-2xl font-semibold text-white bg-terra-500 flex items-center justify-center gap-2 card-shadow-lg active:scale-[.97]">
            <Icon name="cart" size={18}/> Add to Cart
          </button>
        </div>
      </div>

      {/* Inquiry Modal */}
      {showInquiry&&(
        <div className="fixed inset-0 z-50 bg-black/40 flex items-end justify-center">
          <div className="bg-white rounded-t-3xl w-full max-w-[430px] p-6 animate-slide-up" style={{maxHeight:'80vh'}}>
            <div className="w-12 h-1 bg-warm-200 rounded-full mx-auto mb-4"/>
            {inquirySent?(
              <div className="text-center py-6">
                <div className="text-4xl mb-3">✅</div>
                <h3 className="font-bold text-lg text-warm-800 mb-1">Inquiry Sent!</h3>
                <p className="text-sm text-warm-500 mb-4">{artisan?.name||'The artisan'} will respond to your enquiry soon.</p>
                <button onClick={()=>{setShowInquiry(false);setInquirySent(false);setInquiryMsg('');setInquiryQty('1');}} className="w-full py-3 rounded-2xl font-semibold bg-terra-500 text-white">Done</button>
              </div>
            ):<> 
              <h3 className="font-bold text-warm-800 text-lg mb-1">Enquire about this craft</h3>
              <p className="text-sm text-warm-500 mb-4">Message {artisan?.name||'the artisan'} about {p.name}</p>
              <div className="bg-warm-50 rounded-xl p-3 flex items-center gap-3 mb-4">
                <img src={p.images&&p.images[0]} className="w-12 h-12 rounded-lg object-cover" alt=""/>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium text-warm-800 truncate">{p.name}</p>
                  <p className="text-xs text-terra-600 font-bold">₹{p.price.toLocaleString('en-IN')}</p>
                </div>
              </div>
              <label className="text-xs font-medium text-warm-500 mb-1 block">Quantity</label>
              <input type="number" value={inquiryQty} onChange={e=>setInquiryQty(e.target.value)} min="1" className="w-full bg-warm-50 rounded-xl px-4 py-3 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-terra-200"/>
              <label className="text-xs font-medium text-warm-500 mb-1 block">Your message</label>
              <textarea value={inquiryMsg} onChange={e=>setInquiryMsg(e.target.value)} rows={3} placeholder={"e.g. I'd like to order 25 pieces for my store..."}
                className="w-full bg-warm-50 rounded-xl px-4 py-3 text-sm mb-4 resize-none focus:outline-none focus:ring-2 focus:ring-terra-200"/>
              <div className="flex gap-3">
                <button onClick={()=>{setShowInquiry(false);setInquirySent(false);}} className="flex-1 py-3 rounded-2xl font-medium text-warm-600 border border-warm-200">Cancel</button>
                <button onClick={()=>{setInquirySent(true);try{const inq={id:Date.now(),product:p.name,artisan:artisan?.name||p.artisanName,qty:parseInt(inquiryQty)||1,message:inquiryMsg,buyer:'Buyer',date:new Date().toISOString(),status:'New'};const existing=JSON.parse(localStorage.getItem('kalasetu_inquiries')||'[]');existing.unshift(inq);localStorage.setItem('kalasetu_inquiries',JSON.stringify(existing));}catch(e){}}} disabled={!inquiryMsg.trim()} className="flex-1 py-3 rounded-2xl font-semibold text-white bg-terra-500 disabled:bg-warm-200 disabled:text-warm-400 flex items-center justify-center gap-2"><Icon name="send" size={16}/> Send Inquiry</button>
              </div>
            </>}
          </div>
        </div>
      )}
    </div>
  );
};

// ==================== ARTISAN DETAIL (BUYER VIEW) ====================

  const a=selectedArtisan;
  if(!a)return null;
  const products=PRODUCTS.filter(p=>p.artisanId===a.id);

  return (
    <div className="pb-8">
      <div className="px-5 pt-12 pb-6 bg-gradient-to-b from-terra-50 to-warm-50">
        <button onClick={()=>setPage('home')} className="flex items-center gap-2 text-warm-500 mb-6">
          <Icon name="arrowLeft" size={20}/> Back
        </button>
        <div className="text-center">
          <img src={a.photo} className="w-24 h-24 rounded-full mx-auto mb-3 object-cover card-shadow-lg" alt={a.name}/>
          <h1 className="text-2xl font-bold text-warm-800">{a.name}</h1>
          <p className="text-sm text-warm-500 mt-1">{a.craft}</p>
          <p className="text-xs text-warm-400 mt-1 flex items-center justify-center gap-1"><Icon name="mapPin" size={12}/> {a.region}</p>
          <div className="mt-2 flex justify-center"><VerifiedBadge size="md"/></div>
          <div className="flex justify-center gap-4 mt-4 text-center">
            <div><p className="font-bold text-warm-800">{a.yearsExp}+</p><p className="text-[10px] text-warm-400">Years</p></div>
            <div><p className="font-bold text-warm-800">{products.length}</p><p className="text-[10px] text-warm-400">Products</p></div>
          </div>
        </div>
      </div>

      <div className="px-5 pt-5">
        <div className="bg-white rounded-2xl p-5 card-shadow mb-6">
          <h3 className="font-semibold text-warm-800 mb-2">My Story</h3>
          <p className="text-sm text-warm-600 leading-relaxed italic">"{a.story}"</p>
        </div>

        {/* Trust & Authenticity */}
        <div className="bg-forest-50 rounded-2xl p-4 border border-forest-100 mb-6">
          <p className="text-xs font-semibold text-forest-700 mb-3 uppercase tracking-wide">Craft Story & Origin</p>
          <div className="space-y-2.5">
            {[
              {icon:'shield',text:'Artisan identity verified'},
              {icon:'check',text:'Craft profile verified'},
              {icon:'mapPin',text:`Region: ${a.region}`},
              {icon:'user',text:'Artisan story shared'},
            ].map((item,i)=>(
              <div key={i} className="flex items-center gap-2.5 text-sm text-forest-700">
                <div className="w-6 h-6 bg-forest-100 rounded-lg flex items-center justify-center"><Icon name={item.icon} size={12} className="text-forest-600"/></div>
                {item.text}
              </div>
            ))}
          </div>
        </div>

        <h3 className="font-semibold text-warm-800 mb-3">Products by {a.name.split(' ')[0]}</h3>
        <div className="grid grid-cols-2 gap-3">
          {products.map(p=>(
            <ProductCard key={p.id} product={p} onClick={()=>{setSelectedProduct(p);setPage('productDetail');}}/>
          ))}
        </div>
      </div>
    </div>
  );
};

// ==================== BUYER CART ====================
const BuyerCart=()=>{
  const {cart,removeFromCart,setPage}=useContext(AppContext);
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);

  if(cart.length===0){
    return (
      <div className="px-5 pt-12 flex flex-col items-center justify-center min-h-[70vh] text-center">
        <div className="text-5xl mb-4">🛒</div>
        <h2 className="text-xl font-bold text-warm-800 mb-2">Your cart is empty</h2>
        <p className="text-sm text-warm-500 mb-6">Discover handmade crafts from artisans across India</p>
        <button onClick={()=>setPage('home')} className="btn-primary">Start Shopping</button>
      </div>
    );
  }

  return (
    <div className="px-5 pt-12 pb-32">
      <h1 className="text-2xl font-bold text-terra-800 mb-1">Your Cart</h1>
      <p className="text-warm-400 text-sm mb-6">{cart.length} item{cart.length>1?'s':''}</p>

      <div className="space-y-3 mb-6">
        {cart.map(item=>{
          const artisan=ARTISANS.find(a=>a.id===item.artisanId);
          return (
            <div key={item.id} className="bg-white rounded-2xl p-3 flex gap-3 card-shadow">
              <img src={item.images[0]} className="w-20 h-20 rounded-xl object-cover" alt={item.name}/>
              <div className="flex-1 min-w-0">
                <p className="font-medium text-sm text-warm-800 truncate">{item.name}</p>
                <p className="text-xs text-warm-400">{artisan?.name}</p>
                <div className="flex items-center justify-between mt-2">
                  <p className="text-sm font-bold text-terra-600">₹{item.price.toLocaleString('en-IN')}</p>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-warm-400">Qty: {item.qty}</span>
                    <button onClick={()=>removeFromCart(item.id)} className="text-warm-300 hover:text-red-400">
                      <Icon name="trash" size={14}/>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="bg-white rounded-2xl p-4 card-shadow mb-4">
        <div className="flex justify-between text-sm mb-2"><span className="text-warm-500">Subtotal</span><span className="font-medium">₹{total.toLocaleString('en-IN')}</span></div>
        <div className="flex justify-between text-sm mb-2"><span className="text-warm-500">Shipping</span><span className="font-medium text-forest-600">Free</span></div>
        <div className="border-t border-warm-100 pt-2 mt-2 flex justify-between"><span className="font-semibold">Total</span><span className="font-bold text-terra-600 text-lg">₹{total.toLocaleString('en-IN')}</span></div>
      </div>

      <button onClick={()=>setPage('checkout')} className="w-full py-4 rounded-2xl font-semibold text-lg bg-terra-500 text-white card-shadow-lg active:scale-[.97]">
        Proceed to Checkout
      </button>
    </div>
  );
};

  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);

  const handlePlace=()=>{
    placeOrder();
  };

  return (
    <div className="px-5 pt-12 pb-8">
      <button onClick={()=>setPage('cart')} className="flex items-center gap-2 text-warm-500 mb-6">
        <Icon name="arrowLeft" size={20}/> Back
      </button>
      <h1 className="text-2xl font-bold text-terra-800 mb-6">Checkout</h1>

      <div className="space-y-4 mb-6">
        <div className="bg-white rounded-2xl p-4 card-shadow">
          <label className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-2 block">Delivery Address</label>
          <input value={address} onChange={e=>setAddress(e.target.value)} className="w-full bg-warm-50 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-terra-200"/>
        </div>
        <div className="bg-white rounded-2xl p-4 card-shadow">
          <label className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-2 block">Phone Number</label>
          <input value={phone} onChange={e=>setPhone(e.target.value)} className="w-full bg-warm-50 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-terra-200"/>
        </div>
      </div>

      <div className="bg-white rounded-2xl p-4 card-shadow mb-6">
        <p className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-3">Order Summary</p>
        {cart.map(item=>(
          <div key={item.id} className="flex justify-between text-sm py-2 border-b border-warm-50 last:border-0">
            <span className="text-warm-600 truncate flex-1">{item.name} × {item.qty}</span>
            <span className="font-medium ml-2">₹{(item.price*item.qty).toLocaleString('en-IN')}</span>
          </div>
        ))}
        <div className="flex justify-between pt-3 mt-1"><span className="font-semibold">Total</span><span className="font-bold text-terra-600 text-lg">₹{total.toLocaleString('en-IN')}</span></div>
      </div>

      <div className="bg-white rounded-2xl p-4 card-shadow mb-6">
        <p className="text-xs font-medium text-warm-400 uppercase tracking-wide mb-3">Payment Method</p>
        <div className="bg-mustard-50 rounded-xl p-3 border border-mustard-200 flex items-center gap-3">
          <Icon name="rupee" size={18} className="text-mustard-600"/>
          <div>
            <p className="text-sm font-medium text-warm-800">Demo Payment</p>
            <p className="text-xs text-warm-400">No real payment will be charged</p>
          </div>
          <div className="ml-auto w-5 h-5 rounded-full border-4 border-terra-500 flex items-center justify-center"/>
        </div>
      </div>

      <button onClick={handlePlace} className="w-full py-4 rounded-2xl font-semibold text-lg bg-terra-500 text-white card-shadow-lg active:scale-[.97]">
        Place Order — ₹{total.toLocaleString('en-IN')}
      </button>
    </div>
  );
};
