<style>
@layer base {
  html, body {
    margin: 0;
    padding: 0;
    background-color: #0B0F14;
    color: #F1F5F9;
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
}

/* Custom Dark Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #0B0F14;
}
::-webkit-scrollbar-thumb {
  background: #263342;
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: #334356;
}
.hide-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.hide-scrollbar::-webkit-scrollbar {
  display: none;
}

/* Keyframes */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes pulseGentle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.98); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes spinSlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
.animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
.animate-scale-in { animation: scaleIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
.animate-spin-slow { animation: spinSlow 3s linear infinite; }

.delay-50 { animation-delay: 50ms; }
.delay-100 { animation-delay: 100ms; }
.delay-150 { animation-delay: 150ms; }
.delay-200 { animation-delay: 200ms; }
.delay-300 { animation-delay: 300ms; }

/* Buttons & Interactive Components */
.btn-primary {
  background: #6366F1;
  color: #F1F5F9;
  font-weight: 600;
  border-radius: 12px;
  padding: 12px 24px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 4px 16px rgba(99,102,241,0.25);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.btn-primary:hover {
  background: #4F46E5;
  box-shadow: 0 6px 22px rgba(99,102,241,0.4);
  transform: translateY(-1px);
}
.btn-primary:active {
  transform: translateY(0) scale(0.98);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-secondary {
  background: #182230;
  color: #F1F5F9;
  font-weight: 600;
  border-radius: 12px;
  padding: 12px 24px;
  border: 1px solid #263342;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.btn-secondary:hover {
  background: #1E2B3D;
  border-color: #334356;
  transform: translateY(-1px);
}
.btn-secondary:active {
  transform: translateY(0) scale(0.98);
}

.btn-cyan {
  background: #22D3EE;
  color: #0B0F14;
  font-weight: 700;
  border-radius: 12px;
  padding: 12px 24px;
  box-shadow: 0 4px 16px rgba(34,211,238,0.25);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.btn-cyan:hover {
  background: #06B6D4;
  box-shadow: 0 6px 22px rgba(34,211,238,0.4);
  transform: translateY(-1px);
}
.btn-cyan:active {
  transform: translateY(0) scale(0.98);
}

.btn-ghost {
  background: transparent;
  color: #94A3B8;
  font-weight: 500;
  border-radius: 10px;
  padding: 8px 16px;
  border: none;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
}
.btn-ghost:hover {
  background: #182230;
  color: #F1F5F9;
}

/* Glass & Card Surfaces */
.glass-panel {
  background: rgba(18, 25, 35, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid #263342;
}

/* Gradients */
.gradient-text {
  background: linear-gradient(135deg, #818CF8 0%, #22D3EE 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.gradient-gold {
  background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Wave dots for audio / thinking */
.wave-dot {

  height: 6px;

  background: #6366F1;

.wave-dot:nth-child(3) { animation-delay: 0.4s; }

input, textarea, select {

}
select option {
  background-color: #121923;
  color: #F1F5F9;
}
</style>

// ==================== BADGES ====================
const Badge=({children,variant="default",className=""})=>{
  const styles={
    default:"bg-[#182230] text-[#94A3B8] border border-[#263342]",
    primary:"bg-[#6366F1]/15 text-[#818CF8] border border-[#6366F1]/30",
    secondary:"bg-[#8B5CF6]/15 text-[#A78BFA] border border-[#8B5CF6]/30",
    cyan:"bg-[#22D3EE]/15 text-[#22D3EE] border border-[#22D3EE]/30",
    success:"bg-[#34D399]/15 text-[#34D399] border border-[#34D399]/30",
    verified:"bg-[#22D3EE]/15 text-[#22D3EE] border border-[#22D3EE]/40 font-semibold",
    warning:"bg-[#F59E0B]/15 text-[#FBBF24] border border-[#F59E0B]/30",
  };
  return <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ${styles[variant]||styles.default} ${className}`}>{children}</span>;
};

const VerifiedBadge=({size="sm"})=>(
  <Badge variant="verified" className="shadow-sm">
    <Icon name="shield" size={size==="sm"?11:13}/> Verified Artisan
  </Badge>
);

// Real Gemini Chat API
const chatWithAI=async(msg,context)=>{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),20000);
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg,context:context||{}}),
      signal:controller.signal
    });
    clearTimeout(timeout);
    if(!resp.ok){
      const errData=await resp.json().catch(()=>({}));
      throw new Error(errData.error||'AI assistant is currently unavailable.');
    }
    const data=await resp.json();
    return data.reply;
  }catch(e){
    clearTimeout(timeout);
    if(e.name==='AbortError')throw new Error('AI took too long to respond. Please try again.');
    throw e;
  }
};

// Real Gemini Vision Cataloguing API
const analyzeProductImage=async(photoData,voiceDesc)=>{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),25000);
  try{
    const resp=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:photoData,description:voiceDesc||''}),
      signal:controller.signal
    });
    clearTimeout(timeout);
    if(!resp.ok){
      const errData=await resp.json().catch(()=>({}));
      throw new Error(errData.error||'AI product analysis service unavailable.');
    }
    const result=await resp.json();
    const minPrice=typeof result.minPrice==='number'&&result.minPrice>0?Math.round(result.minPrice):800;
    const maxPrice=typeof result.maxPrice==='number'&&result.maxPrice>minPrice?Math.round(result.maxPrice):Math.max(1500,minPrice+500);
    const suggestedPrice=Math.round((minPrice+maxPrice)/2);
    return {
      ...result,
      minPrice,
      maxPrice,
      suggestedPrice
    };
  }catch(e){
    clearTimeout(timeout);
    if(e.name==='AbortError')throw new Error('AI analysis timed out. Please try again.');
    throw e;
  }
};

    return [

    ];
  });
  const [myProducts,setMyProducts]=useState(()=>{
    try{
      const s=localStorage.getItem('kalasetu_products');
      return s?JSON.parse(s):[];
    }catch(e){
      return [];
    }
  });
  const [selectedProduct,setSelectedProduct]=useState(null);
  const [selectedArtisan,setSelectedArtisan]=useState(null);
  const [catFlow,setCatFlow]=useState({step:0,photoDesc:'',voiceDesc:'',result:null,enhanced:false,finalPrice:0});
  const [notification,setNotification]=useState(null);
  const [artisanProfile,setArtisanProfile]=useState({
    name:'Savita Patil',
    craft:'Handloom Weaver',
    village:'Kolhapur',
    district:'Kolhapur',
    state:'Maharashtra',
    photo:'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300&h=300&fit=crop&crop=face',
    story:'I learned weaving from my mother and grandmother at the age of 12. For over 15 years, I have been creating traditional pit-loom sarees that blend Maharashtrian heritage with contemporary wearability.',
    language:'Hindi'
  });
  const [onboarded,setOnboarded]=useState(true);
  const [searchQuery,setSearchQuery]=useState('');
  const [selectedCategory,setSelectedCategory]=useState(null);
  const [selectedRegion,setSelectedRegion]=useState(null);
  const [priceRange,setPriceRange]=useState(null);
  const [wishlist,setWishlist]=useState([1, 4]);

  const toggleWishlist=(id)=>{
    setWishlist(prev=>{
      const exists=prev.includes(id);
      showNotif(exists?'Removed from wishlist':'Saved to wishlist ❤️');
      return exists?prev.filter(x=>x!==id):[...prev,id];
    });
  };

  const addToCart=(product)=>{
    setCart(prev=>{
      const exists=prev.find(c=>c.id===product.id);
      if(exists){
        return prev.map(c=>c.id===product.id?{...c,qty:c.qty+1}:c);
      }
      return [...prev,{...product,qty:1}];
    });
    showNotif(`Added "${product.name.slice(0, 24)}..." to cart! 🛍️`);
  };

  const removeFromCart=(id)=>{
    setCart(prev=>prev.filter(c=>c.id!==id));
    showNotif('Item removed from cart');
  };

  const updateCartQty=(id,delta)=>{
    setCart(prev=>prev.map(c=>{
      if(c.id===id){
        const newQty=Math.max(1,c.qty+delta);
        return {...c,qty:newQty};
      }
      return c;
    }));
  };

  const placeOrder=(deliveryInfo)=>{
    const orderNum="KS-"+Date.now().toString(36).toUpperCase().slice(-5);
    window.__lastOrderNum=orderNum;
    const newOrder={
      id:orderNum,
      items:[...cart],
      total:cart.reduce((s,c)=>s+c.price*c.qty,0),
      date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),
      status:'New',
      address:(deliveryInfo&&deliveryInfo.address)||"123, Heritage Lane, Mumbai",
      phone:(deliveryInfo&&deliveryInfo.phone)||"9876543210"
    };
    setOrders(prev=>[newOrder,...prev]);
    setCart([]);
    setPage('orderConfirmed');
    return orderNum;
  };

  const showNotif=(msg)=>{
    setNotification(msg);
    setTimeout(()=>setNotification(null),3200);
  };

  const val={
    role,setRole,page,setPage,lang,setLang,cart,setCart,orders,setOrders,
    myProducts,setMyProducts,selectedProduct,setSelectedProduct,
    selectedArtisan,setSelectedArtisan,catFlow,setCatFlow,
    artisanProfile,setArtisanProfile,onboarded,setOnboarded,
    addToCart,removeFromCart,updateCartQty,placeOrder,showNotif,
    searchQuery,setSearchQuery,selectedCategory,setSelectedCategory,
    selectedRegion,setSelectedRegion,priceRange,setPriceRange,
    wishlist,toggleWishlist,
  };

  return (
    <AppContext.Provider value={val}>
      <div className="min-h-screen bg-[#0B0F14] text-[#F1F5F9] relative selection:bg-[#6366F1]/30 selection:text-[#22D3EE]">
        {/* Global Toast */}
        {notification&&(
          <div className="fixed bottom-20 lg:bottom-6 right-4 left-4 lg:left-auto lg:right-6 z-50 animate-slide-up flex justify-center lg:justify-end pointer-events-none">
            <div className="bg-[#182230] border border-[#263342] text-[#F1F5F9] px-5 py-3 rounded-xl shadow-elevated flex items-center gap-3 text-sm font-medium backdrop-blur-md pointer-events-auto">
              <span className="w-2 h-2 rounded-full bg-[#22D3EE] animate-pulse"></span>
              {notification}
            </div>
          </div>
        )}

        {/* View Router */}
        {role===null&&(
          <LandingPage/>
        )}

        {role==='artisan'&&(
          !onboarded ? <OnboardingFlow/> : <ArtisanApp/>
        )}

        {role==='buyer'&&(
          <BuyerApp/>
        )}
      </div>
    </AppContext.Provider>
  );
};

// ==================== ONBOARDING FLOW ====================
const OnboardingFlow=()=>{
  const {artisanProfile,setArtisanProfile,setOnboarded}=useContext(AppContext);
  const [step,setStep]=useState(0);
  const [isRecording,setIsRecording]=useState(false);

  const states=["Maharashtra","Rajasthan","Bihar","Assam","Uttar Pradesh","Karnataka","West Bengal","Odisha","Gujarat","Tamil Nadu","Madhya Pradesh","Kerala"];
  const crafts=["Handloom Weaving","Terracotta & Pottery","Embroidery","Bamboo Weaving","Brass & Metalwork","Wood Carving","Block Printing","Traditional Jewellery","Folk Painting","Leather Craft"];

  const update=(k,v)=>setArtisanProfile(p=>({...p,[k]:v}));

  const handleVoiceInput=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      setIsRecording(true);
      setTimeout(()=>{
        setArtisanProfile(p=>({
          ...p,
          story:(p.story?(p.story+' '):'')+'I learned this craft from my family elders and have been perfecting these traditional hand techniques for over 15 years.'
        }));
        setIsRecording(false);
      },1600);
      return;
    }
    try{
      const r=new SR();
      r.continuous=false;
      r.interimResults=false;
      r.lang=artisanProfile.language==='Marathi'?'mr-IN':artisanProfile.language==='Hindi'?'hi-IN':'en-IN';
      r.onresult=(e)=>{
        const t=e.results[0][0].transcript;
        setArtisanProfile(p=>({...p,story:(p.story?(p.story+' '):'')+t}));
        setIsRecording(false);
      };
      r.onerror=()=>{setIsRecording(false);};
      r.onend=()=>setIsRecording(false);
      r.start();
      setIsRecording(true);
    }catch(e){
      setIsRecording(false);
    }
  };

  return (
    <div className="min-h-screen bg-[#0B0F14] flex flex-col justify-between max-w-xl mx-auto px-5 py-8 animate-fade-in">
      {/* Step Indicators */}
      <div>
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg bg-[#6366F1] flex items-center justify-center text-sm">🎨</div>
            <span className="font-display font-bold text-sm text-[#F1F5F9]">Artisan Setup</span>
          </div>
          <span className="text-xs font-mono font-medium text-[#22D3EE] bg-[#22D3EE]/10 px-2.5 py-1 rounded-full border border-[#22D3EE]/20">
            Step {step+1} of 4
          </span>
        </div>
        <div className="grid grid-cols-4 gap-2 mb-8">
          {[0,1,2,3].map(i=>(
            <div key={i} className={`h-1.5 rounded-full transition-all duration-300 ${i<=step?'bg-gradient-to-r from-[#6366F1] to-[#22D3EE]':'bg-[#182230]'}`}/>
          ))}
        </div>
      </div>

      {/* Step Contents */}
      <div className="flex-1 flex flex-col justify-center py-4">
        {step===0&&(
          <div className="space-y-5 animate-slide-up">
            <div>
              <h2 className="font-display text-2xl font-bold text-[#F1F5F9]">Welcome to KalaSetu! 🙏</h2>
              <p className="text-sm text-[#94A3B8] mt-1">Tell us about yourself so buyers can discover your handmade creations.</p>
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-[#94A3B8] uppercase tracking-wider block mb-2">Your Full Name</label>
                <input
                  value={artisanProfile.name}
                  onChange={e=>update('name',e.target.value)}
                  placeholder="e.g. Savita Patil"
                  className="w-full bg-[#121923] border border-[#263342] focus:border-[#6366F1] rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-1 focus:ring-[#6366F1] transition-colors"
                />
              </div>

              <div>
                <label className="text-xs font-semibold text-[#94A3B8] uppercase tracking-wider block mb-2">Primary Craft / Skill</label>
                <select
                  value={artisanProfile.craft}
                  onChange={e=>update('craft',e.target.value)}
                  className="w-full bg-[#121923] border border-[#263342] focus:border-[#6366F1] rounded-xl px-4 py-3.5 text-sm focus:outline-none transition-colors"
                >
                  <option value="">Select your craft</option>
                  {crafts.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              <div>
                <label className="text-xs font-semibold text-[#94A3B8] uppercase tracking-wider block mb-2">Village / Town / Workshop Location</label>
                <input
                  value={artisanProfile.village}
                  onChange={e=>update('village',e.target.value)}
                  placeholder="e.g. Kolhapur"
                  className="w-full bg-[#121923] border border-[#263342] focus:border-[#6366F1] rounded-xl px-4 py-3.5 text-sm focus:outline-none transition-colors"
                />
              </div>
            </div>

            <button
              onClick={()=>setStep(1)}
              disabled={!artisanProfile.name||!artisanProfile.craft}
              className="btn-primary w-full py-4 text-sm mt-4 disabled:opacity-50"
            >
              Continue to Location →
            </button>
          </div>
        )}

        {step===1&&(
          <div className="space-y-5 animate-slide-up">
            <div>
              <h2 className="font-display text-2xl font-bold text-[#F1F5F9]">Where are you crafting from? 📍</h2>
              <p className="text-sm text-[#94A3B8] mt-1">This connects you with regional craft buyers across India.</p>

            <div className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-[#94A3B8] uppercase tracking-wider block mb-2">State</label>
                <select
                  value={artisanProfile.state}
                  onChange={e=>update('state',e.target.value)}
                  className="w-full bg-[#121923] border border-[#263342] focus:border-[#6366F1] rounded-xl px-4 py-3.5 text-sm focus:outline-none transition-colors"

                  <option value="">Select State</option>
                  {states.map(s=><option key={s} value={s}>{s}</option>)}

              <div>
                <label className="text-xs font-semibold text-[#94A3B8] uppercase tracking-wider block mb-2">Preferred Communication Language</label>
                <div className="grid grid-cols-3 gap-2.5">
                  {[
                    {v:'Hindi',l:'हिंदी'},
                    {v:'Marathi',l:'मराठी'},
                    {v:'English',l:'English'}
                  ].map(opt=>(
                    <button
                      key={opt.v}

                      onClick={()=>update('language',opt.v)}
                      className={`py-3 rounded-xl text-sm font-semibold border transition-all ${
                        artisanProfile.language===opt.v
                          ? 'bg-[#6366F1]/20 border-[#6366F1] text-[#F1F5F9] shadow-sm'
                          : 'bg-[#121923] border-[#263342] text-[#94A3B8] hover:text-[#F1F5F9]'
                      }`}
                    >
                      {opt.l}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex gap-3 pt-4">
              <button onClick={()=>setStep(0)} className="btn-secondary flex-1 py-3.5">Back</button>
              <button onClick={()=>setStep(2)} disabled={!artisanProfile.state} className="btn-primary flex-2 py-3.5 disabled:opacity-50">
                Continue to Story →
              </button>
            </div>
          </div>
        )}

        {step===2&&(
          <div className="space-y-5 animate-slide-up">
            <div>
              <h2 className="font-display text-2xl font-bold text-[#F1F5F9]">Share your artisan story 📖</h2>
              <p className="text-sm text-[#94A3B8] mt-1">Buyers value the human hands and generational heritage behind each piece.</p>
            </div>

            <div className="space-y-3">
              <div className="bg-[#121923] border border-[#263342] rounded-xl p-4">
                <textarea
                  value={artisanProfile.story}
                  onChange={e=>update('story',e.target.value)}
                  rows={5}
                  placeholder="I learned this craft from my family and have been practicing for many years..."

                }`}
              >
                <Icon name="mic" size={18}/>
                <span>{isRecording?'Listening... speak in any language':'Tell your story with voice'}</span>
                {isRecording&&<span className="flex gap-1 ml-2"><span className="wave-dot bg-[#EF4444]"/><span className="wave-dot bg-[#EF4444]"/><span className="wave-dot bg-[#EF4444]"/></span>}
              </button>
            </div>

            <div className="flex gap-3 pt-4">
              <button onClick={()=>setStep(1)} className="btn-secondary flex-1 py-3.5">Back</button>
              <button onClick={()=>setStep(3)} className="btn-primary flex-2 py-3.5">
                Review Profile →
              </button>
            </div>
          </div>
        )}

        {step===3&&(
          <div className="space-y-6 text-center animate-scale-in">
            <div className="w-18 h-18 rounded-2xl bg-gradient-to-br from-[#6366F1] to-[#22D3EE] p-0.5 mx-auto shadow-glow-primary">
              <div className="w-full h-full bg-[#121923] rounded-2xl flex items-center justify-center text-3xl">
                ✨

// ==================== SMART CATALOGUING FLOW ====================
const AddProductFlow=()=>{
  const {catFlow,setCatFlow,setPage,showNotif,artisanProfile,setMyProducts}=useContext(AppContext);
  const [voiceText,setVoiceText]=useState("");
  const [isRecording,setIsRecording]=useState(false);
  const [photoUploaded,setPhotoUploaded]=useState(false);
  const [photoData,setPhotoData]=useState(null);
  const [editedTitle,setEditedTitle]=useState('');
  const [editedCategory,setEditedCategory]=useState('Textiles');
  const [editedSubcategory,setEditedSubcategory]=useState('General');
  const [editedDesc,setEditedDesc]=useState('');
  const [editedMaterials,setEditedMaterials]=useState([]);
  const [editedTags,setEditedTags]=useState([]);
  const [editedPrice,setEditedPrice]=useState('1800');
  const [enhanced,setEnhanced]=useState(false);
  const [publishStep,setPublishStep]=useState(0); // 0=preview, 1=publishing, 2=live
  const [isAnalyzing,setIsAnalyzing]=useState(false);
  const [analyzeError,setAnalyzeError]=useState(null);
  const [analysisStage,setAnalysisStage]=useState(0);
  const fileInputRef=useRef(null);
  const recognitionRef=useRef(null);

  const stages=[
    "Analyzing product photograph...",
    "Identifying craft technique & category...",
    "Inspecting authentic materials & textures...",
    "Composing e-commerce marketplace description...",
    "Calculating fair handmade market price..."
  ];

  // Photo upload handler
  const handlePhotoSelect=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const allowed=['image/jpeg','image/jpg','image/png','image/webp'];
    if(!allowed.includes(file.type)){
      showNotif('Please upload a JPG, PNG, or WEBP image.');
      return;
    }
    if(file.size>10*1024*1024){
      showNotif('Image size must be under 10MB.');
      return;
    }
    const reader=new FileReader();
    reader.onload=()=>{
      setPhotoData(reader.result);
      setPhotoUploaded(true);
      setAnalyzeError(null);
    };
    reader.readAsDataURL(file);
  };

  // Voice recording handler
  const handleVoiceToggle=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR && !isRecording){
      try{
        const r=new SR();
        r.continuous=false;
        r.interimResults=false;
        r.lang=artisanProfile.language==='Marathi'?'mr-IN':artisanProfile.language==='Hindi'?'hi-IN':'en-IN';
        r.onresult=(e)=>{
          const transcript=e.results[0][0].transcript;
          setVoiceText(prev=>prev?(prev+' '+transcript):transcript);
          setIsRecording(false);
        };
        r.onerror=()=>{
          setIsRecording(false);
          const sample="This is an authentic handwoven cotton piece made on traditional pit looms in Kolhapur.";
          setVoiceText(sample);
          showNotif('Speech captured');
        };
        r.onend=()=>setIsRecording(false);
        recognitionRef.current=r;
        r.start();
        setIsRecording(true);
      }catch(e){
        setIsRecording(false);
      }
    }else if(isRecording && recognitionRef.current){
      recognitionRef.current.stop();
      setIsRecording(false);
    }else{
      // Fallback demo speech input
      setIsRecording(true);
      setTimeout(()=>{
        const sample="This is a handcrafted artisan piece made with natural dyes and pure traditional materials.";
        setVoiceText(prev=>prev?(prev+' '+sample):sample);
        setIsRecording(false);
        showNotif('Voice input transcribed');
      },1500);
    }
  };

  // Run real AI analysis using Gemini Vision
  const executeAnalysis=async()=>{
    if(!photoData)return;
    setIsAnalyzing(true);
    setAnalyzeError(null);
    setCatFlow(p=>({...p,step:1}));

    // Start stage timer sequence for UI polish
    let stageIndex=0;
    const interval=setInterval(()=>{
      stageIndex++;
      if(stageIndex<stages.length){
        setAnalysisStage(stageIndex);
      }
    },2200);

    try{
      const result=await analyzeProductImage(photoData,voiceText);
      clearInterval(interval);

      setCatFlow(p=>({
        ...p,
        step:2,
        result:result,
        finalPrice:result.suggestedPrice
      }));

      setEditedTitle(result.title||'Handcrafted Artisan Product');
      setEditedCategory(result.category||'Textiles');
      setEditedSubcategory(result.subcategory||'General');
      setEditedDesc(result.description||'');
      setEditedPrice(String(result.suggestedPrice||1800));
      setEditedMaterials(Array.isArray(result.materials)?result.materials:['Natural materials']);
      setEditedTags(Array.isArray(result.tags)?result.tags:['Handmade','Authentic']);
      setIsAnalyzing(false);

    }catch(err){
      clearInterval(interval);
      console.warn('AI analysis error:',err);
      setIsAnalyzing(false);
      setAnalyzeError(err.message||'AI analysis is temporarily unavailable. You can retry or enter details manually.');
      // Keep user in step 0 with clear feedback
      setCatFlow(p=>({...p,step:0}));
    }
  };

  // Publish to marketplace and persist
  const handlePublishListing=()=>{
    setPublishStep(1); // publishing spinner
    const newProduct={
      id:Date.now(),
      artisanId:1, // linked to active artisan
      name:editedTitle,
      category:editedCategory,
      subcategory:editedSubcategory,
      price:parseInt(editedPrice)||1800,
      minPrice:catFlow.result?.minPrice||1200,
      maxPrice:catFlow.result?.maxPrice||2500,
      description:editedDesc,
      materials:[...editedMaterials],
      tags:[...editedTags],
      images:photoData?[photoData]:["https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=700&h=700&fit=crop"],
      region:artisanProfile.state||"Maharashtra",
      available:true,
      artisanName:artisanProfile.name||"Savita Patil",
      artisanLocation:(artisanProfile.village||"Kolhapur")+", "+(artisanProfile.state||"Maharashtra"),
      createdAt:new Date().toISOString(),
      published:true
    };

    // Update state and localStorage
    setMyProducts(prev=>[newProduct,...prev]);
    try{

// ==================== ARTISAN BUSINESS COPILOT ====================
const AIAssistant=()=>{
  const {artisanProfile,catFlow,myProducts}=useContext(AppContext);
  const [messages,setMessages]=useState([
    {
      from:'ai',
      text:"Namaste! 🙏 I am your KalaSetu Business Copilot. How can I help you grow your craft business today? Ask me about pricing, customer demand, photography advice, or order management."
    }
  ]);
  const [input,setInput]=useState('');
  const [isLoading,setIsLoading]=useState(false);
  const [errorMessage,setErrorMessage]=useState(null);
  const messagesEndRef=useRef(null);

  useEffect(()=>{
    messagesEndRef.current?.scrollIntoView({behavior:'smooth'});
  },[messages,isLoading]);

  // 6 Actionable Business Prompts
  const suggestedPrompts=[
    "Improve my product listing",
    "Suggest a fair price",
    "Help me sell more",
    "Explain my orders",
    "Translate my listing",
    "Improve my description"
  ];

  // Context builder for Gemini prompt
  const buildArtisanContext=()=>{
    const ctx={};
    if(artisanProfile.name)ctx.artisanName=artisanProfile.name;
    if(artisanProfile.craft)ctx.artisanCraft=artisanProfile.craft;
    if(artisanProfile.village||artisanProfile.state){
      ctx.artisanLocation=[artisanProfile.village,artisanProfile.state].filter(Boolean).join(', ');
    }
    if(catFlow.result){
      ctx.productName=catFlow.result.title||catFlow.result.identified;
      ctx.productCategory=catFlow.result.category;
      ctx.productPrice=catFlow.result.suggestedPrice||catFlow.result.minPrice;
      ctx.productDescription=catFlow.result.description;
      ctx.productMaterials=(catFlow.result.materials||[]).join(', ');
      ctx.productTags=(catFlow.result.tags||[]).join(', ');
    }else if(myProducts&&myProducts.length>0){
      const latest=myProducts[0];
      ctx.productName=latest.name;
      ctx.productCategory=latest.category;
      ctx.productPrice=latest.price;
      ctx.productDescription=latest.description;
      ctx.productMaterials=(latest.materials||[]).join(', ');
      ctx.productTags=(latest.tags||[]).join(', ');
    }
    return ctx;
  };

  const handleSend=async(msgToSend)=>{
    const text=typeof msgToSend==='string'?msgToSend:input;
    if(!text.trim()||isLoading)return;

    setErrorMessage(null);
    setMessages(prev=>[...prev,{from:'user',text}]);
    setInput('');
    setIsLoading(true);

    try{
      const reply=await chatWithAI(text,buildArtisanContext());
      setMessages(prev=>[...prev,{from:'ai',text:reply}]);
    }catch(err){
      console.error('Chat error:',err);
      setErrorMessage(err.message||'Failed to connect to AI copilot.');
      setMessages(prev=>[
        ...prev,
        {from:'ai',text:"I encountered a temporary connection issue. Please verify your internet connection and try asking again.",isError:true}
      ]);
    }finally{
      setIsLoading(false);
    }
  };

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-6 py-6 flex flex-col h-[calc(100vh-140px)] animate-fade-in">
      {/* Copilot Header */}
      <div className="bg-[#121923] border border-[#263342] rounded-2xl p-4 sm:p-5 flex items-center justify-between shadow-card mb-4 shrink-0">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#6366F1] to-[#22D3EE] p-0.5 shadow-glow-primary">
            <div className="w-full h-full bg-[#121923] rounded-2xl flex items-center justify-center text-xl">
              🤖
            </div>
          </div>
          <div>
            <div className="flex items-center gap-2">
              <h2 className="font-display text-base font-bold text-[#F1F5F9]">KalaSetu Business Copilot</h2>
              <span className="text-[10px] bg-[#34D399]/15 text-[#34D399] px-2 py-0.5 rounded-full font-bold border border-[#34D399]/30 flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-[#34D399] animate-pulse"></span> Online
              </span>
            </div>
            <p className="text-xs text-[#94A3B8] mt-0.5">Powered by Google Gemini 3.6 Flash · Contextual to your studio</p>
          </div>
        </div>

        <div className="hidden sm:flex items-center gap-2 text-xs text-[#64748B]">
          <span className="w-2 h-2 rounded-full bg-[#22D3EE]"></span>
          <span>Studio Active: {artisanProfile.name}</span>
        </div>
      </div>

      {/* Message Feed */}
      <div className="flex-1 overflow-y-auto space-y-4 pr-1 mb-4 rounded-2xl bg-[#0B0F14]/60 border border-[#263342]/60 p-4">
        {messages.map((m,idx)=>(
          <div
            key={idx}
            className={`flex ${m.from==='user'?'justify-end':'justify-start'} animate-slide-up`}
          >
            <div className={`flex gap-3 max-w-[85%] sm:max-w-[75%] ${m.from==='user'?'flex-row-reverse':''}`}>
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-xs shrink-0 font-bold ${
                m.from==='user'
                  ? 'bg-[#6366F1] text-white shadow-glow-primary'
                  : 'bg-[#182230] border border-[#263342] text-[#22D3EE]'
              }`}>
                {m.from==='user'?'You':'AI'}
              </div>

              <div
                className={`rounded-2xl px-4 py-3.5 text-sm leading-relaxed whitespace-pre-wrap shadow-sm ${
                  m.from==='user'
                    ? 'bg-[#6366F1] text-[#F1F5F9] rounded-tr-none'
                    : m.isError
                    ? 'bg-[#EF4444]/15 border border-[#EF4444]/30 text-[#EF4444] rounded-tl-none'
                    : 'bg-[#121923] border border-[#263342] text-[#F1F5F9] rounded-tl-none'
                }`}
              >
                {m.text}
              </div>
            </div>
          </div>
        ))}

        {/* Thinking Indicator */}
        {isLoading&&(
          <div className="flex justify-start animate-fade-in">
            <div className="flex items-center gap-3 bg-[#121923] border border-[#263342] rounded-2xl rounded-tl-none px-4 py-3 text-xs text-[#94A3B8]">
              <div className="w-5 h-5 rounded-lg bg-[#22D3EE]/15 text-[#22D3EE] flex items-center justify-center font-bold">
                ✨
              </div>
              <span className="font-medium">Copilot is analyzing craft data...</span>
              <span className="flex gap-1 ml-1">
                <span className="wave-dot"/>
                <span className="wave-dot"/>
                <span className="wave-dot"/>
              </span>
            </div>
          </div>
        )}

        <div ref={messagesEndRef}/>
      </div>

      {/* Suggested Action Chips */}
      {messages.length<=3 && !isLoading && (
        <div className="mb-3">
          <p className="text-[11px] font-bold uppercase tracking-wider text-[#64748B] mb-2">Suggested Business Actions:</p>
          <div className="flex flex-wrap gap-2">
            {suggestedPrompts.map((prompt,i)=>(
              <button
                key={i}
                type="button"
                onClick={()=>handleSend(prompt)}
                className="px-3 py-1.5 rounded-xl bg-[#121923] hover:bg-[#182230] border border-[#263342] hover:border-[#6366F1] text-xs font-medium text-[#94A3B8] hover:text-[#F1F5F9] transition-colors"
              >
                ⚡ {prompt}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Input Bar */}
      <div className="bg-[#121923] border border-[#263342] rounded-2xl p-2 flex items-center gap-2 shadow-card shrink-0">
        <input
          value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&!isLoading&&handleSend()}
          placeholder={isLoading ? 'AI Copilot is composing advice...' : 'Ask how to improve sales, price crafts, or handle orders...'}
          disabled={isLoading}
          className="flex-1 bg-transparent px-3 py-2 text-sm text-[#F1F5F9] focus:outline-none placeholder:text-[#64748B] disabled:opacity-50"
        />
        <button
          onClick={()=>handleSend()}
          disabled={isLoading||!input.trim()}
          className="btn-primary py-2.5 px-4 text-xs font-bold shrink-0 disabled:opacity-40"
        >
          <Icon name="send" size={15}/>
          <span className="hidden sm:inline">Send</span>
        </button>
      </div>
    </div>
  );
};

const ArtisanProducts=()=>{
  const {myProducts,setMyProducts,showNotif,setPage,setSelectedProduct}=useContext(AppContext);
  const [editingProduct,setEditingProduct]=useState(null);
  const [editName,setEditName]=useState('');
  const [editPrice,setEditPrice]=useState('');
  const [editDesc,setEditDesc]=useState('');
  const [searchFilter,setSearchFilter]=useState('');

  const allActiveProducts=[...myProducts,...PRODUCTS];

  const filteredProducts=allActiveProducts.filter(p=>{
    if(!searchFilter)return true;
    const q=searchFilter.toLowerCase();
    return p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q);
  });

  const startEdit=(p)=>{
    setEditingProduct(p);
    setEditName(p.name);
    setEditPrice(String(p.price));
    setEditDesc(p.description);
  };

  const saveEdit=()=>{
    if(!editingProduct)return;
    const newPrice=parseInt(editPrice)||editingProduct.price;
    const updatedMyProducts=myProducts.map(p=>
      p.id===editingProduct.id ? {...p, name:editName, price:newPrice, description:editDesc} : p
    );
    setMyProducts(updatedMyProducts);
    try{
      localStorage.setItem('kalasetu_products',JSON.stringify(updatedMyProducts));
    }catch(e){}

    setEditingProduct(null);
    showNotif('Product updated successfully! ✅');
  };

  const deleteProduct=(id)=>{
    const updated=myProducts.filter(p=>p.id!==id);
    setMyProducts(updated);
    try{
      localStorage.setItem('kalasetu_products',JSON.stringify(updated));
    }catch(e){}
    showNotif('Product removed from studio inventory 🗑️');
  };

const ArtisanOrders=()=>{
  const {orders,setOrders,showNotif}=useContext(AppContext);
  const [activeTab,setActiveTab]=useState('All');
  const tabs=['All','New','Preparing','Shipped','Delivered'];

  const advanceOrderStatus=(orderId,nextStatus)=>{
    setOrders(prev=>prev.map(o=>o.id===orderId?{...o,status:nextStatus}:o));
    showNotif(`Order ${orderId} updated to ${nextStatus} 📦`);
  };

  const filteredOrders=orders.filter(o=>{
    if(activeTab==='All')return true;
    return o.status===activeTab;
  });

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-8 space-y-6 animate-fade-in">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-[#263342]">
        <div>
          <h1 className="font-display text-2xl sm:text-3xl font-bold text-[#F1F5F9]">Studio Orders</h1>
          <p className="text-xs text-[#94A3B8] mt-0.5">Fulfill and track orders placed across the KalaSetu marketplace</p>
        </div>
      </div>

      {/* Tabs */}
      <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
        {tabs.map(tab=>(
          <button
            key={tab}
            onClick={()=>setActiveTab(tab)}
            className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all whitespace-nowrap ${
              activeTab===tab
                ? 'bg-[#6366F1] text-white border-[#6366F1] shadow-glow-primary'
                : 'bg-[#121923] border-[#263342] text-[#94A3B8] hover:text-[#F1F5F9]'
            }`}
          >
            {tab}
          </button>
        ))}
      </div>

      {/* Orders List */}
      <div className="space-y-4">
        {filteredOrders.length===0?(
          <div className="bg-[#121923] border border-[#263342] rounded-2xl p-12 text-center text-[#64748B] text-xs">
            No orders under status "{activeTab}".

          filteredOrders.map(order=>(
            <div key={order.id} className="bg-[#121923] border border-[#263342] rounded-2xl p-5 shadow-card space-y-4">

                  <span className="font-mono text-sm font-bold text-[#F1F5F9]">{order.id}</span>
                  <span className="text-xs text-[#64748B]">{order.date}</span>
                </div>
                <span className={`text-xs font-bold px-3 py-1 rounded-full border self-start sm:self-auto ${
                  order.status==='New'
                    ? 'bg-[#22D3EE]/15 text-[#22D3EE] border-[#22D3EE]/30'
                    : order.status==='Preparing'
                    ? 'bg-[#6366F1]/15 text-[#818CF8] border-[#6366F1]/30'
                    : order.status==='Shipped'
                    ? 'bg-[#8B5CF6]/15 text-[#A78BFA] border-[#8B5CF6]/30'
                    : 'bg-[#34D399]/15 text-[#34D399] border-[#34D399]/30'
                }`}>
                  Status: {order.status}
                </span>
              </div>

              {/* Items in order */}
              <div className="space-y-2">
                {order.items.map((it,i)=>(
                  <div key={i} className="flex items-center justify-between text-xs">
                    <div className="flex items-center gap-2.5">

                  <span>Deliver to: </span>
                  <span className="text-[#F1F5F9] font-medium">{order.address}</span>
                </div>

                <div className="flex items-center gap-2">

                    <button
                      onClick={()=>advanceOrderStatus(order.id,'Preparing')}
                      className="btn-primary py-1.5 px-3 text-xs"

                      Start Preparing Craft

// ==================== BUYER EXPLORE ====================
const BuyerExplore=()=>{
  const {
    setSelectedProduct,
    setPage,
    searchQuery,
    setSearchQuery,
    selectedCategory,
    setSelectedCategory,
    selectedRegion,
    setSelectedRegion,
    priceRange,
    setPriceRange,
    myProducts
  }=useContext(AppContext);

  const allProducts=[...myProducts,...PRODUCTS];

  // Filtering logic
  const filteredProducts=allProducts.filter(p=>{
    if(searchQuery){
      const q=searchQuery.toLowerCase();
      const matchName=p.name.toLowerCase().includes(q);
      const matchCat=p.category.toLowerCase().includes(q);
      const matchDesc=(p.description||'').toLowerCase().includes(q);
      const matchMat=(p.materials||[]).join(' ').toLowerCase().includes(q);
      const matchTag=(p.tags||[]).join(' ').toLowerCase().includes(q);
      const matchArt=(p.artisanName||'').toLowerCase().includes(q);
      if(!matchName&&!matchCat&&!matchDesc&&!matchMat&&!matchTag&&!matchArt)return false;
    }
    if(selectedCategory&&p.category!==selectedCategory)return false;
    if(selectedRegion&&p.region!==selectedRegion)return false;
    if(priceRange){
      if(p.price<priceRange[0]||p.price>priceRange[1])return false;
    }
    return true;
  });

  const clearFilters=()=>{
    setSearchQuery('');
    setSelectedCategory(null);
    setSelectedRegion(null);
    setPriceRange(null);
  };

  return (
    <div className="px-4 sm:px-6 lg:px-8 py-8 space-y-6 animate-fade-in">
      {/* Header & Search Bar */}
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-[#263342]">
        <div>
          <h1 className="font-display text-2xl sm:text-3xl font-bold text-[#F1F5F9]">Explore Crafts</h1>
          <p className="text-xs text-[#94A3B8] mt-0.5">Showing {filteredProducts.length} authentic handmade items</p>
        </div>

        {/* Search Input */}
        <div className="w-full md:w-80 relative">
          <Icon name="search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#64748B]"/>
          <input
            value={searchQuery}
            onChange={e=>setSearchQuery(e.target.value)}
            placeholder="Search crafts, artisans, materials..."
            className="w-full bg-[#121923] border border-[#263342] focus:border-[#6366F1] rounded-xl pl-10 pr-4 py-2.5 text-xs text-[#F1F5F9] focus:outline-none"
          />
          {searchQuery&&(
            <button onClick={()=>setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-[#64748B] hover:text-[#F1F5F9]">
              Clear
            </button>
          )}
        </div>
      </div>

      {/* Filter Chips & Dropdowns */}
      <div className="space-y-3 bg-[#121923] border border-[#263342] rounded-2xl p-4">
        <div className="flex items-center justify-between">
          <span className="text-xs font-bold text-[#94A3B8] uppercase tracking-wider flex items-center gap-1.5">
            <Icon name="filter" size={14}/> Filter By Category:
          </span>
          {(selectedCategory||selectedRegion||priceRange||searchQuery)&&(
            <button
              onClick={clearFilters}
              className="text-xs text-[#EF4444] hover:underline font-semibold"
            >
              Reset all filters
            </button>
          )}
        </div>

        {/* Category Pills */}
        <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
          <button
            onClick={()=>setSelectedCategory(null)}
            className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border transition-all ${
              !selectedCategory
                ? 'bg-[#6366F1] text-white border-[#6366F1] shadow-glow-primary'
                : 'bg-[#182230] border-[#263342] text-[#94A3B8] hover:text-[#F1F5F9]'
            }`}
          >
            All Categories
          </button>
          {CATEGORIES.map(c=>(
            <button
              key={c.name}
              onClick={()=>setSelectedCategory(selectedCategory===c.name?null:c.name)}
              className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border transition-all flex items-center gap-1.5 ${
                selectedCategory===c.name
                  ? 'bg-[#6366F1] text-white border-[#6366F1] shadow-glow-primary'
                  : 'bg-[#182230] border-[#263342] text-[#94A3B8] hover:text-[#F1F5F9]'
              }`}
            >
              <span>{c.icon}</span>
              <span>{c.name}</span>
            </button>
          ))}
        </div>

        {/* Secondary Filters: Region & Price */}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-[#263342]">
          <div>
            <label className="text-[11px] font-semibold text-[#64748B] block mb-1">State / Region</label>
            <select
              value={selectedRegion||''}
              onChange={e=>setSelectedRegion(e.target.value||null)}
              className="w-full bg-[#182230] border border-[#263342] rounded-xl px-3 py-2 text-xs text-[#F1F5F9] focus:outline-none"
            >
              <option value="">All Indian Regions</option>
              {REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
            </select>
          </div>

          <div>
            <label className="text-[11px] font-semibold text-[#64748B] block mb-1">Price Range</label>
            <select
              value={priceRange?priceRange.join('-'):''}
              onChange={e=>{
                const val=e.target.value;
                if(!val){ setPriceRange(null); }
                else if(val==='0-1500'){ setPriceRange([0,1500]); }
                else if(val==='1500-3000'){ setPriceRange([1500,3000]); }
                else if(val==='3000-10000'){ setPriceRange([3000,10000]); }
              }}
              className="w-full bg-[#182230] border border-[#263342] rounded-xl px-3 py-2 text-xs text-[#F1F5F9] focus:outline-none"
            >
              <option value="">All Price Ranges</option>
              <option value="0-1500">Under ₹1,500</option>
              <option value="1500-3000">₹1,500 – ₹3,000</option>
              <option value="3000-10000">Above ₹3,000</option>
            </select>
          </div>
        </div>
      </div>

      {/* Product Card Grid */}
      {filteredProducts.length===0?(
        <div className="bg-[#121923] border border-[#263342] rounded-2xl p-16 text-center space-y-3">
          <Icon name="search" size={32} className="mx-auto text-[#64748B]"/>
          <h3 className="text-base font-bold text-[#F1F5F9]">No craft pieces matched your filters</h3>
          <p className="text-xs text-[#94A3B8]">Try adjusting your search query, price range, or category filter.</p>
          <button onClick={clearFilters} className="btn-secondary py-2 px-4 text-xs font-semibold">
            Clear all filters
          </button>
        </div>
      ):(
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
          {filteredProducts.map(product=>(
            <ProductCard
              key={product.id}
              product={product}
              onClick={()=>{
                setSelectedProduct(product);
                setPage('productDetail');
              }}
            />
          ))}
        </div>
      )}
    </div>
  );
};

  const [showInquiry,setShowInquiry]=useState(false);
  const [inquiryMsg,setInquiryMsg]=useState('');
  const [inquiryQty,setInquiryQty]=useState('1');
  const [inquirySent,setInquirySent]=useState(false);

  const p=selectedProduct;
  if(!p)return null;

  const isWished=wishlist.includes(p.id);
  const artisan=ARTISANS.find(a=>a.id===p.artisanId);
  const artisanName=p.artisanName||artisan?.name||"Master Artisan";
  const artisanLocation=p.artisanLocation||artisan?.region||"Maharashtra, India";
  const allImages=p.images&&p.images.length?p.images:[
    "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=900&h=900&fit=crop"

    if(!inquiryMsg.trim())return;
    const newInquiry={
      id:Date.now(),
      product:p.name,
      artisan:artisanName,
      qty:parseInt(inquiryQty)||1,
      message:inquiryMsg,
      buyer:'Conscious Buyer',
      date:new Date().toLocaleDateString('en-IN'),
      status:'New'
    };
    try{
      const existing=JSON.parse(localStorage.getItem('kalasetu_inquiries')||'[]');
      existing.unshift(newInquiry);
      localStorage.setItem('kalasetu_inquiries',JSON.stringify(existing));

      {/* Switch to Artisan Button */}
      <div className="pt-4 text-center">
        <button
          onClick={()=>{setRole('artisan');setPage('home');}}
          className="btn-secondary w-full py-3.5 text-xs font-semibold"
        >
          🎨 Switch to Artisan Studio Mode
        </button>
      </div>
    </div>
  );
};

// ==================== REACT ROOT MOUNT ====================
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
